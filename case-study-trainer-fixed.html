const DATA=[{"section": "ソーシャルワークの基盤と専門職", "slide": 2, "question": "事例を読んで、Ａスクールソーシャルワーカー（社会福祉士）が、ソーシャルインクルージョンの視点から今後行う取り組みについて適切なものを２つ選びなさい。\n\n〈事例〉\n　　Ｂ国籍の小学生Ｃさん（10歳、女性）は3カ月前に他県から転校してきた。Ｃさんは、新しい学校やクラスに早くなじみたいと願っているが、言葉や文化の違いから、ほかの児童とのコミュニケーションに難しさを感じている。特に、同じクラスの男子児童グループからは、発言を理解してもらえなかったり、からかわれたりすることがあり、孤立感を深めている。 Ｃさんは、担任教師に相談することもできず、日々悩んでいる。このため、Ｃさんは女子児童グループの友人に連れられて、Ａスクールソーシャルワーカーに相談に来た。", "options": ["男子児童グループからからかわれ、孤立化を深めていることから、Ｃさんに無理をしないよう別室での登校を促す。", "担任教師と連携し、Ｃさんの状況をクラス全体に伝え、理解を求める。", "クラス全体に対し、異文化理解に関する授業を実施する。", "Ｃさんに言語や文化の違いを気にしないよう伝え、自分なりにより積極的にコミュニケーションを図るよう促す。", "Ｃさんの母親に対し、Ｃさんがより積極的にコミュニケーションをとれるように家庭で指導を促す。"], "explanations": ["…一時的に彼女のストレスや不安を軽減するかもしれないが、クラスメイトの交流を機会を減らすことで、かえって孤立感を深め、社会的参加が妨げられる結果になる可能性がある。", "…〇", "…〇", "…Ｃさんに「言語や文化の違いは気にしないで」と伝え、より積極的なコミュニケーションを促す事は、彼女の考えている困難や不安を軽視する恐れがある。", "…Ｃさんの母親に対して、Ｃさんがより積極的にコミュニケーション取れるよう家庭で指導するよう促す事は、家庭内での支援を強化する取り組みではあるが、ソーシャルインクルージョンの視点では、個人や家庭にのみ対応するのではなく、学校全体がＣさんを受け入れ支援支える環境整えることが重要である。"], "fullExplanation": "１…一時的に彼女のストレスや不安を軽減するかもしれないが、クラスメイトの交流を機会を減らすことで、かえって孤立感を深め、社会的参加が妨げられる結果になる可能性がある。\n\n２…〇\n\n３…〇\n\n４…Ｃさんに「言語や文化の違いは気にしないで」と伝え、より積極的なコミュニケーションを促す事は、彼女の考えている困難や不安を軽視する恐れがある。\n\n５…Ｃさんの母親に対して、Ｃさんがより積極的にコミュニケーション取れるよう家庭で指導するよう促す事は、家庭内での支援を強化する取り組みではあるが、ソーシャルインクルージョンの視点では、個人や家庭にのみ対応するのではなく、学校全体がＣさんを受け入れ支援支える環境整えることが重要である。", "answers": [2, 3], "expected": 2}, {"section": "ソーシャルワークの基盤と専門職", "slide": 4, "question": "事例を読んで、Ａ介護支援専門員（社会福祉士）が、アドボカシーの視点からＢさんと家族を支援する場合の対応として、適切なものを2つ選びなさい。\n\n〈事例〉\n　　Ｂさん（62歳、男性）は。妻Ｃさん（58歳）と二人暮らしである。一人娘のＤさん（30歳）は他県で暮らしている。Ｂさんは3年前に若年性認知症（アルツハイマー型）と診断された。現在、要介護2と認定されて訪問介護と通所介護を支援支給限度額まで利用している。Ｂさんは一見すると身体上は自立しているが、身の回りのことに不安を感じるため、見守りや介助が必要である。近頃、一人で外出したいというが、途中で道がわからなくなり、何度も警察に保護されている。", "options": ["Ｂさんが不安に感じることについて話を聞き、またＣさん、Ｄさんにも相談の上、社会福祉協議会に見守りボランティアの派遣を働きかける。", "Ｂさんの外出に関して不安を感じているＤさんと相談の結果、Ｃさんが外出する際には、安全確保のためＢさんが部屋から出られないように施錠することを提案する。", "地域で孤立することを防ぐため、Ｃさんに市内に認知症の家族の会があるという情報を提供する。", "Ｂさんの安全確保のため、町内会に回覧板でＢさんとＣさんの状況を詳しく周知するようにはたらきかける。", "Ｂさんが外出したいという気持ちに寄り添い、またＣさん、Ｄ 子と向き合う時間が確 保できないことの背景要因を考慮しつつ, 家族全 体を視野に入れた支援を検討することが最優先事 項である。 \n\n3 x M児童福祉司が単独で家族を支援するよ うな働きかけは適切とはいえない。 公的機関の利 用を拒絶するような支援困難なクライエントであ ることを踏まえ, 多様な機関と専門職の協働によ り支援することが求められている。 \n\n4 × 父親はM児童福祉司との面会自体を拒絶 しており、面会の機会を確保することは困難であ る。また, 定職に就いていないのには, 何らかの 理由が考えられるため、その背景を確認せずに一 方的に定職に就くよう勧めても、根本的な解決にはならない。\n\n5 ○ E子の家族の支援のために必要な情報が不 足していることから, 複数の専門職と関係者が協 力して情報を収集する体制を整え, 支援体制を構 築する必要がある。", "answers": [5], "expected": 1}, {"section": "ソーシャルワークの基盤と専門職", "slide": 8, "question": "事例を読んで,地域包括支援センターの社会福祉士の対応として、現段階で最も適切なものを1つ選びなさい。 \n\n[事例] \nEさん(76歳,要支援1)は認知症の診断を受けている。毎週自転車でパン屋に通うことを楽しみにしていたが,最近, 道に迷ったり事故が発生したり、 警察に連れられて帰宅することが何回もあった。 家族が対応方法困っており、 「必要なものがあれば,買ってくるから, 自転車の運転はやめてほしい」 と地域包括支援センターに相談しに来ている。", "options": ["事故防止のため、 自転車の運転をやめるようにEさんを説得することに決めた。", "Eさんは判断能力が不十分であるため, 家族の意思に基づいて支援方法を提案した。", "家族,警察を含む社会に迷惑をかけていることをまずEさんに伝えるように家族に伝えた。", "家族の話を詳しく聞き取り,Eさんと直接対話をしてから支援方法を決めることを家族に伝えた。", "一人で外出することの危険性を考え、外出支援サービスの利用についてEさんの家族に紹介した。"], "explanations": ["適切でない。 外出は生活の一つの要素である。認知症高齢者は,自分の意思に基づいて出かける権利を有するため,無理やりやめさせることは望ましくない。 \n(『ソーシャルワークの基盤と専門職[共通・社会専門]』中央法規出 版,pp.106~109)", "適切でない。 当事者主権の視点から,まず本人の意思や意向を明確にすることが大切である。 認知症であ \nるからといって、 本人の判断能力を過小評価し, 家族や専門職が代わりに決めるというパターナリズムは望 \nましくない。 \n(『ソーシャルワークの基盤と専門職 [共通・社会専門]』 中央法規出 版, pp.103~105)", "適切でない。 理解できない行動があったとしても, その背後には本人による理由や目的がある。 特に認知 \n症高齢者の場合,記憶障害があるため、否定や指摘をされると戸惑いや混乱、ストレスを感じることがある。そのため、叱責や否定をするのではなく、相手を受け入れる姿勢で接することが望ましい。 \n(『ソーシャルワークの基盤と専門職[共通・社会専門]』中央法規出 版, pp.108~109)", "適切。当事者主権の視点から, まず本人の意思や意向を明確にすることが大切である。 この当事者主権の \n重要性は,認知症のある人に対しても変わることはない。当事者の自己決定権の尊重を大切にしなければな \nらない。 \n(『ソーシャルワークの基盤と専門職 [共通・社会専門]』 中央法規出 版, pp.103~105)", "適切でない。 まずはEさんの状況把握, アセスメントが求められる。 その上で、必要があれば支援サービ \nスを紹介する。 \n(『ソーシャルワークの基盤と専門職[共通・社会専門]』中央法規出 版, pp.58~59)"], "fullExplanation": "1 適切でない。 外出は生活の一つの要素である。認知症高齢者は,自分の意思に基づいて出かける権利を有するため,無理やりやめさせることは望ましくない。 \n(『ソーシャルワークの基盤と専門職[共通・社会専門]』中央法規出 版,pp.106~109) \n\n2 適切でない。 当事者主権の視点から,まず本人の意思や意向を明確にすることが大切である。 認知症であ \nるからといって、 本人の判断能力を過小評価し, 家族や専門職が代わりに決めるというパターナリズムは望 \nましくない。 \n(『ソーシ n3 適切でない。 ソーシャルワークの実践において制度の遵守は不可欠なものであるが,制度の価値とソーシャルワークの価値が矛盾する場合に, 倫理的ジレンマが生じるというものであり、この事例には該当しない。 \n(『ソーシャルワークの基盤と専門職[共通・社会専門]」 中央法規出 版, pp.192~195) \n\n4 適切でない。 プライバシーの保護はソーシャルワーカーの倫理責任の一つであり、状況によっては倫理的ジレンマが生じるが,この事例には該当しない。 \n(『ソーシャルワークの基盤と専門職[共通・社会専門]』中央法規出 版, pp.192~195) \n\n5 適切でない。 プライバシーの保護と社会に対する責任が相反することがあり, 倫理的ジレンマが生じることがあるが,この事例には該当しない。 \n(『ソーシャルワークの基盤と専門職 [共通・社会専門]』 中央法規出 版, pp.192~195)", "answers": [1], "expected": 1}, {"section": "ソーシャルワークの理論と方法", "slide": 13, "question": "事例を読んで、 Ａ医療ソーシャルワーカー（社会福祉士）によるシステム理論に基づく退院調整に関する記述のうち、最も適切なものを1つ選びなさい。\n\n〈事例〉\n　　回復期リハビリテーション病棟に入院しているＢさん（83歳、女性）は脳梗塞による右片麻痺で要介護1の認定を受けている。小刻み歩行で転倒しやすく。立ち上がりにも支障があるため、排泄及び入浴、着脱などにおいても配慮を要する状態である。Ｂさんは「住み慣れた家に帰りたい」と思っているが、隣県に住む一人娘は、退院後、一人で生活させることを不安に感じており、また夫の理解が得られず同居も難しいため、施設へ入所してもらいたいと考えている。そのため、Ｂんは「娘には迷惑をかけられない」と口に出し、自宅への退院をあきらめている。", "options": ["将来的に娘の自宅での同居を期待し、Ｂさんに施設入所を提案する。", "娘の考えを尊重して、自宅での生活は難しいとＢさんに伝える。", "Ｂさんの思いを尊重して、自宅に戻れるように住宅改修を行う。", "Ｂさんの現在の状況を理解してもらうために、娘とその家族との面談の機会を設定する。", "娘の住む地域にある福祉施設について調べ、退院先としてＢさんに情報提供する。"], "explanations": ["…情報収集と分析アセスメント並びにニーズの把握は充分でない状態であり、適切とは言えない。", "…娘はキーパーソンであるが、娘の考えばかりではなく、Bさんの思いを汲み取る必要がある。システム理論とは、人と環境のシステムの中の要素として捉えている。", "…ソーシャルワークにおいて、家族は社会資源であると同時に、クライエント・システムを構成する一要素でもある。主たるクライエントはＢさんであるが、娘を含む家族もクライエント・システムの1部と言える。", "…〇", "…「住み慣れた家に帰りたい」という思いに寄り添わず、社会資源に対する情報提供のみで退院調整をしており、情報収集分析するとアセスメント並びにニーズの把握が充分でないため適切とはいえない。"], "fullExplanation": "１…情報収集と分析アセスメント並びにニーズの把握は充分でない状態であり、適切とは言えない。\n\n２…娘はキーパーソンであるが、娘の考えばかりではなく、Bさんの思いを汲み取る必要がある。システム理論とは、人と環境のシステムの中の要素として捉えている。\n\n３…ソーシャルワークにおいて、家族は社会資源であると同時に、クライエント・システムを構成する一要素でもある。主たるクライエントはＢさんであるが、娘を含む家族もクライエント・システムの1部と言える。\n\n４…〇\n\n５…「住み慣れた家に帰りたい」という思いに寄り添わず、社会資源に対する情報提供のみで退院調整をしており、情報収集分析するとアセスメント並びにニーズの把握が充分でないため適切とはいえない。", "answers": [4], "expected": 1}, {"section": "ソーシャルワークの理論と方法", "slide": 15, "question": "事例を読んで、相談支援事業所のソーシャルワーカー（社会福祉士）が行うエンゲージメント（インテーク）に関する記述のうち、最も適切なものを1つ選びなさい。\n\n〈事例〉\n　　知的障害のあるＡさん（53歳、男性）は、母親と二人で暮らしてきた。しかし、母親が脳梗塞で倒れ救急搬送されたことをきっかけに、障害者支援施設の短期入所利用につながった。当該入所施 する。", "× 解決志向アプローチの視点に基づく支援で ある。解決志向アプローチでは,発生している生 活課題の原因よりも、クライエントが有している 問題解決のイメージを重視し、問題解決の実現に 焦点を当てた支援が行われる。", "× 実存主義アプローチの視点に基づく支援で ある。自分自身の存在価値を認識できず,自己疎 外感を抱いているクライエントの主体性を回復す るための支援である。"], "fullExplanation": "1 × エンパワメント・アプローチの視点に基づく支援である。 エンパワメントアプローチは, 社会的抑圧や差別によってパワレスネス(無力化) 状態に陥っている人々の本来のパワーを取り戻す ために, 情報提供や教育, 訓練等によって自己効 力感を高め,抑圧的な状況を解決できるように支 \n援する。 \n\n2 × 機能的アプローチの視点に基づく支援であ る。ランク(Rank, O.) の意志心理学を源流とする ケースワークの学派であり,ワーカー,クライエ ント, 機関の機能の相互作用により支援を展開する。 \n\n3 ○ 生活モデルでは,クライエントの周囲の環 境への不適応が生活課題の原因であるとし, 両者 が良好な適合状態に至ることを目指して, クライ エントと環境の双方に働きかけることで問題解決 を図ろうとする。 \n\n4 × 解決志向アプローチの視点に基づく支援で ある。解決志向アプローチでは,発生している生 活課題の原因よりも、クライエントが有している 問題解決のイメージを重視し、問題解決の実現に 焦点を当てた支援が行われる。 \n\n5× 実存主義アプローチの視点に基づく支援で ある。自分自身の存在価値を認識できず,自己疎 外感を抱いているクライエントの主体性を回復す るための支援である。", "answers": [3], "expected": 1}, {"section": "ソーシャルワークの理論と方法", "slide": 19, "question": "事例を読んで,F ソーシャルワーカーのAさんへの対応に該当するアプローチとして,最も適切なものを1つ選びなさい。 \n\n〔事例〕 \nS就労継続支援事業所に通所しているAさんは、作業中のミスが多く、事業所を休みがちになっていた。事業所のFソーシャルワーカーは,Aさんがミスをする原因を一緒に考え、どの作業ならミスが少ないのか、ミスを起こすときはどんな場合かなどを話し合いながら, 1週間後を目途に,作業ミスを少なくするという課題をAさんと一緒に設定し, その結果を踏まえてさらに改善に向けて取り組んでいくことにした。", "options": ["問題解決アプローチ", "課題中心アプローチ", "危機介入アプローチ", "ナラティブアプローチ", "行動変容アプローチ"], "explanations": ["x  問題解決アプローチでは、クライエントの ワーカビリティ (問題解決能力)に注目し,問題 を解決しようとする。課題解決のための動機付け (Motivation) をし, 課題解決の機会を提供する ことによって, クライエントの能力 (Capactiy) の向上を図り, クライエントのコンピテンシー (環境への適応能力) の向上を図る。", "〇課題中心アプローチでは、クライエント自 身が課題を自覚できるよう, クライエントと一緒 に達成可能な課題を設定し, その課題達成に短期 的・集中的に取り組み, クライエントが,自ら課 題を解決していけるように援助する。", "× 危機介入アプローチでは,危機的状況に迅 速に介入し,短期集中的に, 情緒的バランスの 回復と,環境への適応力の向上を目指す。", "x ナラティブアプローチでは、人生の物語に 焦点を当て、クライエントがワーカーとの対話に よって、いままでの否定的な人生観(ドミナント ストーリー) を, 新しい肯定的な人生観 (オルタ \nナティブストーリー)に変えていくことができる よう, そして, クライエントが新たな意味の世界 を見出せるよう援助する。", "× 行動変容アプローチは, 条件付け理論や, \n社会的学習理論を基盤として、望ましい行動を強 化し,望ましくない行動を消去するアプローチで \nある。"], "fullExplanation": "1 x  問題解決アプローチでは、クライエントの ワーカビリティ (問題解決能力)に注目し,問題 を解決しようとする。課題解決のための動機付け (Motivation) をし, 課題解決の機会を提供する ことによって, クライエントの能力 (Capactiy) の向上を図り, クライエントのコンピテンシー (環境への適応能力) の向上を図る。 \n\n2 〇課題中心アプローチでは、クライエント自 身が課題を自覚できるよう, クライエントと一緒 に達成可能な課題を設定し, その課題達成に短期 的・集中的に取り組み, クライエントが,自ら課 題を解決していけるように援助する。 \n\n3 × 危機介入アプローチでは,危機的状況に迅 速に介入し,短期集中的に, 情緒的バランスの 回復と,環境への適応力の向上を目指す。 \n\n4 x ナラティブアプローチでは、人生の物語に 焦点を当て、クライエントがワーカーとの対話に よって、いままでの否定的な人生観(ドミナント ストーリー) を, 新しい肯定的な人生観 (オルタ \nナティブストーリー)に変えていくことができる よう, そして, クライエントが新たな意味の世界 を見出せるよう援助する。 \n\n5 × 行動変容アプローチは, 条件付け理論や, \n社会的学習理論を基盤として、望ましい行動を強 化し,望ましくない行動を消去するアプローチで \nある。", "answers": [2], "expected": 1}, {"section": "ソーシャルワークの理論と方法", "slide": 21, "question": "事例を読んで, D職員の支援に関する次の記述のうち, 最も適切なものを1つ選 なさい。 \n[事例] \n外国人住民を支援するNPO法人のD職員は,日本語の学習をサポートするボランティアの育成を目的とするグループワークを通算10期にわたり担当している。 1期の活動プログラムは, 合計6回の隔月開催であり,前半の3回は専門家による講義やボランティア同士の勉強会を主とする学習形式, 後半は学習中の外国人とボランティアの交流, 意見交換を中心とするディスカッション形式の活動である。", "options": ["D職員には,長期にわたるグループワークの経験があり、参加者の一般的な特性や傾向を熟知しているため,この経験に基づいてプログラム活動の詳細を決定することが望ましい。", "活動プログラムが合計6回と少ないため, 参加メンバーのまとまりや一体感を高めるような支援の必要性は低い。", "講義・勉強会形式のグループワークにおいては,メンバーが共通体験をすることにより生じた感情を評価するよりも、講義の教育効果の確認を重視するべきである。", "ディスカッション形式のグループワークにおいては,参加メンバー個々の目標達成ではなく, グループ全体の目標達成に重点を置いて支援していく必要がある。", "外国人の参加者たちから,生活全般や就労についても意見交換の場をもちたいという要請が多くあったため,新たなグループ活動の立ち上げを検討した。"], "explanations": ["x グループワークにおける 「個別化の原則」 に反した支援であり不適切である。 「個別化の原 則」とは,参加メンバー個々の相違点を認識する こと,そしてグループ固有の特徴を認識すること である。 過去の経験に基づいた判断だけで, プロ グラム活動の詳細を決定してはならない。", "× グループワークにおいてはメンバーのまと \nまりや一体感,すなわち, 凝集性を高める支援が 必須である。凝集性とは、グループとしてのまと まりや結束力のことである。 ワーカーには, 凝集 性を高めるための働きかけとその活用が求められる。", "x 感情の評価, 教育効果の確認のどちらか一方だけではなく, 双方を重視すべきである。", "x グループワークにおいてはメンバー個々の 目標とグループ全体としての目標の双方を達成で きるよう支援, 働きかけを行う必要がある。", "○ 新たなニーズが表明された場合, グループ ワーク活動の実現に向けて働きかけていく必要が ある。"], "fullExplanation": "1 x グループワークにおける 「個別化の原則」 に反した支援であり不適切である。 「個別化の原 則」とは,参加メンバー個々の相違点を認識する こと,そしてグループ固有の特徴を認識すること である。 過去の経験に基づいた判断だけで, プロ グラム活動の詳細を決定してはならない。 \n\n2 × グループワークにおいてはメンバーのまと \nまりや一体感,すなわち, 凝集性を高める支援が 必須である。凝集性とは、グループとしてのまと まりや結束力のことである。 ワーカーには, 凝集 性を高めるための働きかけとその活用が求められる。 \n\n3 x 感情の評価, 教育効果の確認のどちらか一方だけではなく, 双方を重視すべきである。 \n\n4 x グループワークにおいてはメンバー個々の 目標とグループ全体としての目標の双方を達成で きるよう支援, 働きかけを行う必要がある。 \n\n5 ○ 新たなニーズが表明された場合, グループ ワーク活動の実現に向けて働きかけていく必要が ある。", "answers": [5], "expected": 1}, {"section": "ソーシャルワークの理論と方法", "slide": 23, "question": "事例を読んで, 相談支援事業所のソーシャルワーカー (社会福祉士)が行うエンゲージメント (インテーク) に関する記述のうち, 最も適切なものを1つ選びなさい。 \n〔事例〕 \n知的障害のあるHさん (53歳,男性)は、母親と二人で暮らしてきた。 しかし, 母親が脳梗塞で倒れ救急搬送されたことをきっかけに、障害者支援施設の短期入所利用につながった。 当該入所施設では, Hさんは口数が少なく、他の利用者とのかかわりは見られない。 ただ, 職員の質問には応じ, 短い言葉ではあるがコミュニケーションをとることができる。Hさんは着替えや入浴など身の回りのことは、ある程度自分でできるが, 料理や掃除などは母親に頼りきりであった。 相談支援事業所のソーシャルワーカーは,Hさんと今後の生活について相談するため面談を行った\n。", "options": ["Hさんのニーズを把握するために, 「どのようなことにお困りですか?」と声をかけ,返答があるまでじっと待つことにした\n。", "Hさんの知的障害の状況を把握するため、簡単なテストを実施し、判断能力がどの程度あるかを確認することにした\n。", "Hさんの認識する現状を理解するために,これまでの経緯に沿って, Hさんが現在の状況をどのように感じているのか語ってもらえるようにした。", "Hさんの最善の利益を優先し, Hさんが安心して暮らすためにグループホームの利用を提案した。", "Hさんの置かれた環境の把握のために,年齢,家族構成、親戚との付き合いなどの事実を詳細に聞き取ることにした。"], "explanations": ["適切でない。 知的障害のあるHさんが, 初回の面談 で自らの直面している問題を整理して語ることは難しいと考えられる。 また、 返答があるまでじっと待つことは、プレッシャーとなる可能性もある。 エンゲージメント(インテーク) の段階では,ソーシャルワーカーは,クライエントが自ら語ることができる機会や 雰囲気づくりに努める必要がある。 \n(『ソーシャルワークの理論と方法 [共通科目]』 中央法規出版, p.52,『新・社会福祉士シリーズ8ソーシャルワークの理論と方法』 弘文堂,2021年(以下『ソーシャルワークの理論と方法』 弘文堂), p.71)", "適切でない。 判断能力を確認することは重要であるが,エンゲージメントの段階ではクライエントとの信頼関係 (ラポール) の構築が優先される。 信頼関係が形成されていない段階でテストを実施することは,Hさんに「ソーシャルワーカーは自分を判断能力のない \n人として扱うのではないか」と不安を抱かせることになりかねない。 \n(『ソーシャルワークの理論と方法[共通科目]』中央法規出版, p.54,『新・MINERVA社会福祉士養成テキストブック 5 ソーシャル ワークの理論と方法 I』 ミネルヴァ書房, 2022年(以下『ソーシャル ワークの理論と方法 I』 ミネルヴァ書房), p.43)", "適切。Hさんが自身の置かれている困難な状況を, 短い言葉であっても,自分自身の言葉で語ってもらうことが重要である。 このことなしに援助を進めれば, クライエントであるHさんを置き去りにしてしまうことになる。クライエントの語り (ナラティヴ)は重要な意味をもつため,Hさんが認知している状況とそれに対する感情を語ってもらうようにはたらきかけることは,エンゲージメントの段階では重要である。 \n(『ソーシャルワークの理論と方法[共通科目]』中央法規出版, pp.51~52,『ソーシャルワークの理論と方法 I』 ミネルヴァ書房, pp.42~43)", "適切でない。 厚生労働省社会・援護局障害保健福祉 部長通知「障害福祉サービスの利用等にあたっての意 思決定支援ガイドラインについて」 (平成29年3月31日障発0331第15号)によれば, 「本人の意思を推定することがどうしても困難な場合は、関係者が協議し、本人にとっての最善の利益を判断せざるを得ない場合がある」 と示されている。 Hさんはコミュニケーションが可能であるため, Hさんにとっての最善の利益を優先するならば, Hさんが意思決定できるようはたらきかけることが重要である。 \n(『ソーシャルワークの理論と方法 [共通科目]』 中央法規出版, p.52)", "適切でない。 クライエントの主訴 相談内容とそれを取り巻く状況を理解するプロセスでは,単なる情報収集ではなく, ソーシャルワーカーがその問題に伴うクライエントの感情についても焦点を当てること, 信頼関係を構築することが重要である。 情報収集は重要ではあるが,信頼関係が構築できていないエンゲージメントの段階で事実の詳細な聞き取りは適切でない。 \n(『ソーシャルワークの理論と方法 [共通科目]』 中央法規出版, pp.51~52,『ソーシャルワークの理論と方法 I』 ミネルヴァ書房, PP.42~43)"], "fullExplanation": "1 適切でない。 知的障害のあるHさんが, 初回の面談 で自らの直面している問題を整理して語ることは難しいと考えられる。 また、 返答があるまでじっと待つことは、プレッシャーとなる可能性もある。 エンゲージメント(インテーク) の段階では,ソーシャルワーカーは,クライエントが自ら語ることができる機会や 雰囲気づくりに努める必要がある。 \n(『ソーシャルワークの理論と方法 [共通科目]』 中央法規出版, p.52,『新・社会福祉士シリーズ8ソーシャルワークの理論と方法』 弘文堂,2021年(以下『ソーシャルワークの理論と方法』 弘文堂), p.71) \n\n2適切でない。 判断能力を確認することは重要であるが,エンゲージメントの段階ではクライエントとの信頼関係 (ラポール) の構築が優先される。 信頼関係が形成されていない段階でテストを実施することは,Hさんに「ソーシャルワーカーは自分を判断能力のない \n人として扱うのではないか」と不安を抱かせることになりかねない。 \n(『ソーシャルワークの理論と方法[共通科目]』中央法規出版, p.54,『新・MINERVA社会福祉士養成テキストブック 5 ソーシャル ワークの理論と方法 I』 ミネルヴァ書房, 2022年(以下『ソーシャル ワークの理論と方法 I』 ミネルヴァ書房), p.43) \n\n3 適切。Hさんが自身の置かれている困難な状況を, 短い言葉であっても,自分自身の言葉で語ってもらうことが重要である。 このことなしに援助を進めれば, クライエントであるHさんを置き去りにしてしまうことになる。クライエントの語り (ナラティヴ)は重要な意味をもつため,Hさんが認知している状況とそれに対する感情を語ってもらうようにはたらきかけることは,エンゲージメントの段階では重要である。 \n(『ソーシャルワークの理論と方法[共通科目]』中央法規出版, pp.51~52,『ソーシャルワークの理論と方法 I』 ミネルヴァ書房, pp.42~43) \n\n4 適切でない。 厚生労働省社会・援護局障害保健福祉 部長通知「障害福祉サービスの利用等にあたっての意 思決定支援ガイドラインについて」 (平成29年3月31日障発0331第15号)によれば, 「本人の意思を推定することがどうしても困難な場合は、関係者が協議し、本人にとっての最善の利益を判断せざるを得ない場合がある」 と示されている。 Hさんはコミュニケーションが可能であるため, Hさんにとっての最善の利益を優先するならば, Hさんが意思決定できるようはたらきかけることが重要である。 \n(『ソーシャルワークの理論と方法 [共通科目]』 中央法規出版, p.52) \n\n5 適切でない。 クライエントの主訴 相談内容とそれを取り巻く状況を理解するプロセスでは,単なる情報収集ではなく, ソーシャルワーカーがその問題に伴うクライエントの感情についても焦点を当てること, 信頼関係を構築することが重要である。 情報収集は重要ではあるが,信頼関係が構築できていないエンゲージメントの段階で事実の詳細な聞き取りは適切でない。 \n(『ソーシャルワークの理論と方法 [共通科目]』 中央法規出版, pp.51~52,『ソーシャルワークの理論と方法 I』 ミネルヴァ書房, PP.42~43)", "answers": [3], "expected": 1}, {"section": "ソーシャルワークの理論と方法", "slide": 25, "question": "事例を読んで, R 地区内にあるY 地域包括支援センターに勤務するJ社会福祉士が次にとる対応として,最も適切なものを1つ選びなさい。 \n〔事例〕 \nR地区では,高齢化が進んでおり,高齢者の社会的孤立への対応が求められている。J社会福祉士は,R 地区の住民から、 「用事がないと, 家に閉じこもりがちになる高齢者も多い。 外出のきっかけになるような地域住民のための交流の場を立ち上げたい」と相談を受けた。J社会福祉士は,Y地域 ]』中央法規出版, p.285, 厚生労働省 「地域ケア会議の概要」) \n\n4 適切でない。 現時点では,交流の場の開設目的や場 \n所,日時,プログラムなどが未定であり, ボランティアを募集するための情報が不足している。 そもそもボランティアを募集するかどうか,その場合の募集方法についても、関係者で話し合って検討すべき内容であり,J社会福祉士の判断だけで行うべきではない。(『ソーシャルワークの理論と方法 [共通科目]』中央法規出版, pp.284~285, pp.28~290, 『ソーシャルワークの理論と方法 I』 ミ ネルヴァ書房, pp.209~210) \n\n5 適切でない。 地域支援においては, 住民主体で地域課題を解決できるよう, J社会福祉士の側面的支援が 求められる。今回の事例では、「交流の場を立ち上げたい」という住民のニーズの実現に向けて,専門職だけではなく,商店街や学校など幅広い社会資源にはた らきかけることが必要である。 \n(『ソーシャルワークの理論と方法 [共通科目]』中央法規出版, p.280, 『ソーシャルワークの理論と方法 I 』ミネルヴァ書房, pp.202 ~204)", "answers": [2], "expected": 1}, {"section": "ソーシャルワークの基盤と専門職（専門）", "slide": 28, "question": "事例を読んでＡスクールソーシャルワーカー社会福祉士によるこの時点における対応として、適切なものを2つ選びなさい。\n\n〈事例〉\n　子ども食堂を運営する地域住民Ｂさんから、食堂に通っているＣさん（10歳）について、教育委員会に相談が入った。 Ａスクールソーシャルワーカーは、Ｃさんの通う小学校がある自治体に雇用されている。Ｂさんによると、Ｃさんは2週間前から食堂に通い始めていた。 Ｃさんの家は両親が最近離婚したため、母子家庭である。Ｃさんの話によると、週に1～2回は夜に食べ物がなくおなかが空くので子ども食堂に来るようになったということであった。また、母親は仕事で夜も不在にすることがあるということだった。", "options": ["ネグレクトの可能性を考える必要はない。", "Ｃさんの母親に電話し、食事を作るよう指導した。", "子ども食堂を訪問し、Ｃさんの様子を観察した。", "子ども食堂に支援を任せることにした。", "Ｃさんの小学校に問い合わせ、状況を確認することにした。"], "explanations": ["…この状況はネグレクトである可能性も想定しなければならない。Ｃさんの様子を観察し、学校や地域での状況も確認した上でネグレクトの兆候が見られれば、児童相談所への通告も考慮しなければならない。", "…ソーシャルワーカーとして食事を作るよう指導するという一方的な対応はふさわしくない。", "…〇", "…子ども食堂はインフォーマルな資源として、地域の中で重要な役割を果たしているが、本事例は子どもｍ食堂が受け止めきれないケースであり、適切な機関の専門職が支援をする必要がある。", "…〇"], "fullExplanation": "１…この状況はネグレクトである可能性も想定しなければならない。Ｃさんの様子を観察し、学校や地域での状況も確認した上でネグレクトの兆候が見られれば、児童相談所への通告も考慮しなければならない。\n\n２…ソーシャルワーカーとして食事を作るよう指導するという一方的な対応はふさわしくない。\n\n３…〇\n\n４…子ども食堂はインフォーマルな資源として、地域の中で重要な役割を果たしているが、本事例は子どもｍ食堂が受け止めきれないケースであり、適切な機関の専門職が支援をする必要がある。\n\n５…〇", "answers": [3, 5], "expected": 2}, {"section": "ソーシャルワークの基盤と専門職（専門）", "slide": 30, "question": "事例を読んで、 Ａ社会福祉協議会のＢソーシャルワーカー（社会福祉士）の対応として適切なものを2つ選びなさい。\n\n〈事例〉\n　　Ｂソーシャルワーカーは担当地区の高齢男性Ｃさんから「避難所となる小学校には洋式トイレはあるのか」と尋ねられた。Ｃさんは自身が高齢になるにつれ、大地震が起こった際の不安を抱えていた。Ｂソーシャルワーカーは、Ａ市のあるＤ県沖を震源とする大地震の発生確率が年々高まっているのは知っていたが、身近な住民も大きな不安を抱えている事に気づいていなかった。 Ｂソーシャルワーカーの担当地区には、生活支援コーディネーターや高齢者施設の担当者をメンバーとする協議体が設置されており、関係者が定期的に諸問題を 9, pp.293~302), 日本社会福祉士会ホームページ 「ぱあと なあ紹介」) \n\n4 適切でない。本事例の場合は 「やむを得ない事由に よる措置」の検討が必要となり,事実確認調査等を実施した上で,今後の方針を検討しなければならない。 その際, 社会福祉士個人の判断ではなく, 高齢者虐待対応部署による組織的な対応が求められる。 \n(厚生労働省「「やむを得ない事由による措置』 について」,「ソーシャ ルワークの基盤と専門職 [共通・社会専門]』中央法規出版, p.289, pp.293~302) \n\n5 適切。本事例の場合、多くの支援者で構成される地域ケア会議を開き, 今後の方向性を決めることが急がれる。 医療・福祉関係者と地域ケア会議で情報を共有 することは,ネットワーク構築につながり、 虐待対応の検討に大いに有効である。 \n(長寿社会開発センター 『地域ケア会議運営マニュアル』 2013年, pp.21~26, 『ソーシャルワークの基盤と専門職 [共通・社会専門]』 中央法規出版,p.289, pp.293~302)", "answers": [3, 5], "expected": 2}, {"section": "ソーシャルワークの理論と方法（専門）", "slide": 37, "question": "事例を読んで、Ａコミュニティソーシャルワーカーが行うソーシャルアクションに関する次の記述のうち、適切なものを2つ選びなさい。\n\n〈事例〉\n　　Ｂ市のベッドタウンであるＣ地区では、高齢化の一方で、Ｂ市の移住促進計画に伴う子育て世代の移住が進んでいる。\nＣ地区の地域ボランティアであるＤさん（63歳、女性）は、近くのアパートに住むフィリピン人のシングルマザーＥさん（26歳）の子育ての状況を知り、地区内の子育て相談場所やサービスの少なさを感じた。そこで、同地区の地域ボランティア数名に声をかけ、子育てサロンを企画することにした。企画実行に向け、ＤさんはＢ社会福祉協議会のＡコミュニティソーシャルワーカー（社会福祉士）を訪ね、協力を依頼した。", "options": ["Ｄさんら住民の持つ能力に期待し、社会福祉士やその他専門家が介入することなく問題解決まで到達できるように働きかける。", "Ｄさんら住民によるラウンドテーブルを実施し、Ｅさんを含むＣ地区の子育て世代の状況を確認したり、企画のアイディアについて意見交換ができるように働きかける。", "Ｃ地区もしくわＢ市全体の組織的な活動となるため、Ｅさん個人に寄り添い、Ｅさん個人のニーズに向き合う働きかけは控えるようにする。", "将来的に、住民の互助による住民だけで構成されたソーシャルサポートネットワークの形成を目指す。", "Ｃ地区を含むＢ市の住民が抱える複合的な生活上のニーズを充足させるため。ソーシャル・アドミニストレーションを活用する。"], "explanations": ["…ソーシャルアクションとは世論に働きかけ、新たな制度やサービスの拡充や創設、改善を目指して議会や行政機関に働きかける組織的な活動のこと。", "…〇", "…地域全体ではなく個人も対象とし、ニーズや自己決定を尊重しながら支援することが求められる。", "…ソーシャルサポートネットワークは、インフォーマルとフォーマル両方の社会資源をつなぎ合わせ、1つのネットワークを形成するものである。", "…〇"], "fullExplanation": "１…ソーシャルアクションとは世論に働きかけ、新たな制度やサービスの拡充や創設、改善を目指して議会や行政機関に働きかける組織的な活動のこと。\n\n２…〇\n\n３…地域全体ではなく個人も対象とし、ニーズや自己決定を尊重しながら支援することが求められる。\n\n４…ソーシャルサポートネットワークは、インフォーマルとフォーマル両方の社会資源をつなぎ合わせ、1つのネットワークを形成するものである。\n\n５…〇", "answers": [2, 5], "expected": 2}, {"section": "ソーシャルワークの理論と方法（専門）", "slide": 39, "question": "事例を読んで、事例検討会の進め方に関する次の記述のうち、適切なものを2つ選びなさい。\n\n〈事例〉\n　　Ａ社会福祉士は事例検討会を行う上で、まずは事前準備として事例検討会のスタイルやルールの確認、事例の提供者や参加メンバーの選択、資料の作成などを行った。事例検討会では、事例提供者による事例紹介の後、参加者による事例検討を行ない、検討によって得られた事例提供者の気づきを発表した。そして、検討によって得られたケースにおける事例提供者の新たな視点を確認し、さらなる事例検討を行い、事例提供者による総括と検討メンバーによるコメントをもって事例検討会を終了した。", "options": ["検討の初期段階では、事例提供者への積極的な指導や批判的な発言は控え、事例における情報の収集と把握に努める。", "多様な意見や考えを尊重するために、事例検討会では最後に全体のまとめはしない。", "事例検討会では、事例提供者が課題だと考えていることを明確にするため、事例提供者の思考や感情、行動を尊重する。", "事例検討会は多様な考え方を尊重する場であり、スーパービジョンとは目的が異なる。", "事例検討会で使用された資料は、参加者が持ち帰って、それぞれの職場や別の勉強会などで再検討する。"], "explanations": ["…〇", "…事例検討会において、多様な意見や考えを知る事は有用な学びの要素となる。", "…〇", "…事例検討会の目的は、利用者に対するより良い支援を目指して、支援者が困難になっている理由を明らかにしていくことにある。", "…事例における情報の記載方法については、匿名化するなどの配慮を行う。"], "fullExplanation": "１…〇\n\n２…事例検討会において、多様な意見や考えを知る事は有用な学びの要素となる。\n\n３…〇\n\n４…事例検討会の目的は、利用者に対するより良い支援を目指して、支援者が困難になっている理由を明らかにしていくことにある。\n\n５…事例における情報の記載方法については、匿名化するなどの配慮を行う。", "answers": [1, 3], "expected": 2}, {"section": "ソーシャルワークの理論と方法（専門）", "slide": 41, "question": "事例を読んで、Ａ社会福祉法人が取り組む地域における公益的な取り組みについて、この段階におけるＢ社会福祉士の対応として、最も適切なものを1つ選びなさい。\n\n〈事例〉\n　　Ａ社会福祉法人では、地域における公益的な取り組みの一環として、地域住民と一緒に取り組む活動について話し合う機会を初めて設けた。 Ａ社会福祉法人からは、この取り組みの中心を担うＢ社会福祉士が参加した。そこで地域住民から、「最近、病院難民や買い物難民といった移動に困難な人がいることをニュースや新聞で知りました。しかし、私たちの身近でそういう問題が起こっているとは考えられません。これは事実ですか」という意見が出された。この話し合いを受けて、Ｂ社会福祉士は今後の展開を考えることとなった。", "options": ["地域住民の意見を集約し、行政へ提言する。", "社会福祉士として、地域課題を整理したものを地域住民に提示する。", "移動に困難な人がいることを、地域住民に広く知ってもらえるように働きかける。", "地域住民と一緒に、地域課題を整理する機会を設ける。", "地域住民からの意見を受けて、この問題は当地域における重要課題ではないと判断する。"], "explanations": ["…話し合いの機会を初めて設けたいという現段階では、提言するのは時期尚早である。", "…住民と一緒に取り組む活動では、住民主体の考えに基づき、地域住民が地域の課題の整理に取り組むことが求められ、社会福祉は側面的な支援での関わりがとなる。", "…移動に困難な人がいることを地域住民に知ってもらえるように働きかける事は、次の段階の動きといえる。", "…〇", "…はじめての話し合いで出た意見だけで、地域における重要な課題ではないと判断するのは早計である。"], "fullExplanation": "１…話し合いの機会を初めて設けたいという現段階では、提言するのは時期尚早である。\n\n２…住民と一緒に取り組む活動では、住民主体の考えに基づき、地域住民が地域の課題の整理に取り組むことが求められ、社会福祉は側面的な支援での関わりがとなる。\n\n３…移動に困難な人がいることを地域住民に知ってもらえるように働きかける事は、次の段階の動きといえる。\n\n４…〇\n\n５…はじめての話し合いで出た意見だけで、地域における重要な課題ではないと判断するのは早計である。", "answers": [4], "expected": 1}, {"section": "ソーシャルワークの理論と方法（専門）", "slide": 43, "question": "事例を読んで, カウンセラーの技法を示す用語として,最も適切なものを1つ選びなさい。 \n\n[事例] \n2021年 (令和3年) 4月, S市職員はカウンセラーとともに災害公営住宅を訪問した。 この ような住宅では,地域のつながりが失われたことにより, 社会的孤立が問題となっている。 あ る住人は「地震で子どもも夫も、家も全部なくしました。 生きる意味をなくしたまま, 一人の まま、10年経って いまさら何かを変えてほしいなんて気にはなれません」と淡々と語った。 カウンセラーは「おつらい経験をなさいましたね。 お気持ちをお察し申し上げます。 こちらも 無理強いするつもりはございません。 ただ, お困りごとがあった際には,私どものことを頼っ ていただけますでしょうか」と応じた。", "options": ["感情の反映", "感情の転移", "自己開示", "閉ざされた質問", "開かれた質問"], "explanations": ["〇 感情の反映は,カウンセラーが受け止めた 相談者の感情を言語化して返答する技術である。 クライエントの感情を真摯に受け止め,共感的な 理解を示すことによって, 信頼関係を構築するこ とが可能となる。 また, 同時にクライエントの自 由な感情の表出を促す契機ともなる。", "× 感情の転移とは,カウンセリング技術では なく、クライエントの肯定的、または否定的な感 情がカウンセラーに向けられることをいう。 そし て、感情の転移によってカウンセラーが葛藤状態 に陥り,情緒的な反応を引き起こすことを感情の 逆転移という。", "× 自己開示とは, カウンセラー自身が自らの 考え方,感じ方, 経験などについて、クライエン トにありのままを言葉で伝えるカウンセリング技 術である。", "× 閉ざされた質問とは,「はい」または「いい え」や,あるいは限定的に答えられるような質問 形式のことである。 例えば、 「昨日はよく眠れましたか」や「ご出身はどちらですか」 などが該当する。", "× 開かれた質問とは 返答の内容を相手に委ねる質問形式のことである。 例えば, 「どのよう な用件でいらっしゃいましたか」 や 「そのときど う思いましたか」などが該当する。"], "fullExplanation": "1　〇 感情の反映は,カウンセラーが受け止めた 相談者の感情を言語化して返答する技術である。 クライエントの感情を真摯に受け止め,共感的な 理解を示すことによって, 信頼関係を構築するこ とが可能となる。 また, 同時にクライエントの自 由な感情の表出を促す契機ともなる。 \n\n2 × 感情の転移とは,カウンセリング技術では なく、クライエントの肯定的、または否定的な感 情がカウンセラーに向けられることをいう。 そし て、感情の転移によってカウンセラーが葛藤状態 に陥り,情緒的な反応を引き起こすことを感情の 逆転移という。\n\n3 × 自己開示とは, カウンセラー自身が自らの 考え方,感じ方, 経験などについて、クライエン トにありのままを言葉で伝えるカウンセリング技 術である。\n \n4 × 閉ざされた質問とは,「はい」または「いい え」や,あるいは限定的に答えられるような質問 形式のことである。 例えば、 「昨日はよく眠れましたか」や「ご出身はどちらですか」 などが該当する。\n \n5 × 開かれた質問とは 返答の内容を相手に委ねる質問形式のことである。 例えば, 「どのよう な用件でいらっしゃいましたか」 や 「そのときど う思いましたか」などが該当する。", "answers": [1], "expected": 1}, {"section": "ソーシャルワークの理論と方法（専門）", "slide": 45, "question": "事例を読んで, Hソーシャルワーカーの対応で, ネットワーキングに該当する記述として,最も適切なものを1つ選びなさい。\n \n[事例] \n民生委員から,市町村社会福祉協議会のHソーシャルワーカー (社会福祉士) に,Aさんの件で相談があった。 Aさんには, 精神疾患があり, 体調が悪いときはゴミ出しができず, 家の中だけでなくベランダまでごみがあふれ、悪臭や害虫が発生しているため近隣からの苦情が絶えないとのことであった。", "options": ["Aさんの了解を得て民生委員とAさん宅を訪問し, Aさんの状況を把握した。", "障害者の相談支援事業所に, Aさんが利用できるサービスについて問い合わせを行った。", "Aさん宅の片づけボランティアの募集を行った。", "福祉事務所や相談支援専門員,自治会役員,近隣住民,地域のボランティアに声をかけ, Aさんを支えるための調整会議を開催し, 相互に連携してAさんを支援することとした。", "Aさんと同じような状態にある人が,地域にどの程度いるかを調べるために,アンケート \n調査を行った。"], "explanations": ["× Aさ 版,p.185) \n\n2 適切でない。 入院期間については,法律上に規定はなく 「入院処遇ガイドライン」 により, おおむね18か \n月以内の退院を目指すと書かれている。 \n(『刑事司法と福祉』 中央法規出版,p.185) \n\n3 適切でない。 処遇改善のための請求は、地方裁判所ではなく, 厚生労働大臣に行う (医療観察法第95条)。 \n(『刑事司法と福祉』 中央法規出版, pp.185~186) \n\n4 適切。保護観察所の社会復帰調整官は,指定入院医療機関に入院している者の社会復帰に向けた生活環境 \nの調整を行う(医療観察法第20条,第101条)。 \n(『刑事司法と福祉』 中央法規出版, pp.189~190) \n\n5 適切でない。 通院医療となった者であっても再度の入院が必要と認められた場合は,裁判所の決定によ り入院が認められることがある (医療観察法第59条)。 \n(『刑事司法と福祉』 中央法規出版, p.187 )", "answers": [4], "expected": 1}, {"section": "保健医療と福祉", "slide": 70, "question": "事例を読んで、医療ソーシャルワーカー（社会福祉士）の関係機関との連携について、適切なものを2つ選びなさい。\n\n　〈事例〉\n　　Ａさん（78歳、女性）は買い物中に倒れて救急車で急性期病院に搬送された。肺炎と低栄養状態と診断され、数日間入院となった。Ａさんに家族状況を尋ねると、息子と2人暮らしとのことであった。Ａさんは「息子は障害を持っていて家にいる。外出もほとんどしていない。私が帰らないと食事もしていないと思うから、早く退院したい」と話していた。主治医からの相談を受けた医療ソーシャルワーカーは、退院後の生活についてＡさんだけでなく息子も含めて福祉的な支援が必要と考えたが、Ａさんは「私たち2人で生活していて誰の支援も必要ない」と拒んでいた。医療ソーシャルワーカーは退院後のＡさんの世代の生活について。継続的な支援が必要と考え、今後の関係機関との連携を検討した。", "options": ["息子を含めた複合的な生活課題があるので、重層的支援体制整備事業の支援会議の実施を検討した。", "Ａさんの退院後の地域生活支援のため、地域包括支援センターに介入を依頼した。", "介護保険サービスを利用できるようにするため、居宅介護支援事業所の介護支援専門員に介入を依頼した。", "生活支援体制整備事業の第1層協議体に、Ａさんの世代の見守りを依頼した。", "Ａさんの認知症を予防するために、認知症初期集中支援チームに介入を依頼した。"], "explanations": ["〇", "〇", "居宅支援事業所は、在宅の要介護者に対して日常生活に必要な保健・医療・福祉サービスの調整等を行う機関である。", "生活支援体制整備事業の協議体は、地域の住民と共に支え合う役割がある。第一層協議体は対象区域を市町村区域としている。第二層協議体は日常生活圏域を想定している。Ａさんの場合、より身近な日常生活圏域における支え合いが適切である。", "認知症初期集中支援チームは、認知症の疑いのある人や認知症の人、その家族に対して早い段階で支援を行うチームことである。Ａさんはの認知症の疑いがないので、介入を依頼するのは適切ではない。"], "fullExplanation": "１　〇\n\n２　〇\n\n３　居宅支援事業所は、在宅の要介護者に対して日常生活に必要な保健・医療・福祉サービスの調整等を行う機関である。\n\n４　生活支援体制整備事業の協議体は、地域の住民と共に支え合う役割がある。第一層協議体は対象区域を市町村区域としている。第二層協議体は日常生活圏域を想定している。Ａさんの場合、より身近な日常生活圏域における支え合いが適切である。\n\n５　認知症初期集中支援チームは、認知症の疑いのある人や認知症の人、その家族に対して早い段階で支援を行うチームことである。Ａさんはの認知症の疑いがないので、介入を依頼するのは適切ではない。", "answers": [1, 2], "expected": 2}, {"section": "保健医療と福祉", "slide": 72, "question": "事例を読んで,Kさんに対する医療ソーシャルワーカー(社会福祉士)の助言のうち、最も適切なものを1つ選びなさい。\n\n [事例] \n会社員のKさん (50歳 男性) は独身で, 高齢の母親Lさん (78歳)と二人暮らしである。現在, Lさんは, 胃がん治療のためN総合病院に入院している。 退院後の生活について, Lさん は自宅での療養を強く望んでいるが, KさんはLさんの在宅療養に不安を感じ、院内の医療福祉相談室を訪れた。", "options": ["「在宅での療養が不安な場合は,終末期を想定して介護老人保健施設の入所が可能です」", "「Lさんは末期がんではないため、介護保険の訪問介護は対象になりません」", "「Lさんは後期高齢者医療制度の対象者ですので、高額療養費制度は利用できません」", "「今後は,病状や治療内容について,私が詳細に説明しますので安心してください」", "「退院後,Lさんが要介護状態となった場合,Lさんの通院の付添いに,Kさんは介護休暇を利用することができます」"], "explanations": [], "fullExplanation": "1 × 介護老人保健施設は、在宅復帰を目指す施 設である。長期の療養や終末期の介護(看取り) などを実施することを前提とした施設ではないた め、適切ではない。\n \n2 × Lさんは、介護保険の第1号被保険者(65 歳以上の者)に該当するため, 要介護・要支援の 認定を受けた場合,その原因にかかわらず介護保 険の受給対象者となる。 特定疾病 (がん末期を含 む 16種類の疾病) による要介護・要支援の認定 が受給要件となるのは、第2号被保険者 (40 歳以 上65歳未満の医療保険加入者)である。 \n\n3 x 高額療養費制度は,すべての公的医療保険 利用することができる。 \n\n4 × 病状や治療内容について説明するのは,主 治医の役割である。 医療ソーシャルワーカー業務 指針「三業務の方法等」 (5) の1において,患 者, 家族から直接に受診 受療についての相談を 受けた場合及び医療ソーシャルワーカーが自分で 問題を発見した場合等も、医師に相談し,医師の 指示を受けて援助を行うことと示されている。 \n\n50 介護休暇は, 労働者が要介護状態 (負傷, 疾病または身体上もしくは精神上の障害により 2週間以上の期間にわたり常時介護を必要とする 状態)にある対象家族の介護や世話をするための 休暇である。通院の付添いや介護サービスの手続 代行の場合などでも利用できる。", "answers": [5], "expected": 1}, {"section": "保健医療と福祉", "slide": 74, "question": "事例を読んで,医療ソーシャルワーカー(社会福祉士)の関係機関との連携として適切なものを2つ選びなさい。 \n\n〔事例〕 \nAさん(78歳,女性)は,買い物中に倒れて救急車で急性期病院に搬送された。肺炎と低栄養状態と診断され, 数日間入院となった。 Aさんに家族状況を尋ねると、息子と二人暮らしとのことであった。 Aさんは, 「息子は障害をもっていて家にいる。外出もほとんどしていない。 私が帰らないと食事もしていないと思うから,早く退院したい」と話していた。 主治医からの相談を受けた医療ソーシャルワーカーは、退院後の生活についてAさんだけではなく息子も含めて福祉的な支援 が必要と考えたが,Aさんは「私たち二人で生活していて誰の支援も必要ない」と拒んでいた。医療ソーシャルワーカーは退院後のAさん世帯の生活について, 継続的な支援が 必要と考え,今後の関係機関との連携を検討した。", "options": ["息子を含めた複合的な生活課題があるので,重層的支援体制整備事業の支援会議の実施を検討した。", "Aさんの退院後の地域生活支援のために, 地域包括支援センターに介入を依頼した。", "介護保険サービスを利用できるようにするために, 居宅介護支援事業所の介護支援専門員に介入を依頼した\n。", "生活支援体制整備事業の第1層協議体にAさん世帯の見守りを依頼した。", "Aさんの認知症を予防するために,認知症初期集中支援チームに介入を依頼した。"], "explanations": ["適切。重層的支援体制整備事業における支援会議は、本人の同意がない場合でも,情報共有が可能である。会議の構成員に対する守秘義務を設け, 構成員同士が安心して潜在的な課題を抱える人に関する情報の共有等を行うことを可能とする。地域において関係機関等がそれぞれ把握していながらも支援が届いていない個々の事案の情報の共有や、地域における必要な支援体制の検討を円滑にするものであり,息子を含めた複合的な生活がある本事例においては,その実施を検討することは適切といえる。 なお, 支援会議の構成員の役割は,1気になる事案の情報提供 情報共有, 2見守りと支援方針の理解, 3緊急性がある事案への対応があげられる (社会福祉法第106条の6)。", "適切。地域包括支援センターの役割として,総合相談支援業務と介護予防ケアマネジメントがある。Aさんは入院時に低栄養状態であったことから, 介護予防 と日常生活支援を検討していく必要がある。 \n(『最新 社会福祉士養成講座2高齢者福祉』 中央法規出版,2021年 (以下『高齢者福祉』中央法規出版), p.92, 長寿社会開発センター 「地域包括支援センター業務マニュアル」 pp.7~8)", "適切でない。 居宅介護支援事業所は、在宅の要介護 者に対して,日常生活に必要な保健・医療・福祉サービスの調整等を行う機関である。 Aさんは要介護状態 ではないことから,居宅介護支援事業所の介護支援専門員に介入を依頼するのは,適切ではない。 (『高齢者福祉』中央法規出版, pp.173~174, 「指定居宅介護支援等 の事業の人員及び運営に関する基準」(平成11年3月31日厚生省令第 38号))", "適切でない。 生活支援体制整備事業の協議体は,地 域の住民とともに支え合う役割がある。 第1層協議体は,対象区域を市町村区域としている。 第2層協議体は日常生活圏域を想定している。 Aさんの場合,より身近な日常生活圏域における支え合いが適切である。 (『地域福祉と包括的支援体制』中央法規出版, p.88, 日本総合研究 所「新しい包括的支援事業における生活支援コーディネーター・協議 体の先行事例の調査研究事業報告書」 2017年)", "適切でない。認知症初期集中支援チームは,認知症の疑いのある人や認知症の人、 その家族に対して早い段階で支援を行うチームのことである。 Aさんは認知症の疑いがないので,認知症初期集中支援チームに介入を依頼するのは適切でない。 \n(『保健医療と福祉』 弘文堂, p.166, 国立長寿医療研究センター 「2020年度認知症初期集中支援チーム員研修テキスト」,2020年, P.6) ソーシャルワークの基盤と専門職(専門)"], "fullExplanation": "1 適切。重層的支援体制整備事業における支援会議は、本人の同意がない場合でも,情報共有が可能である。会議の構成員に対する守秘義務を設け, 構成員同士が安心して潜在的な課題を抱える人に関する情報の共有等を行うことを可能とする。地域において関係機関等がそれぞれ把握していながらも支援が届いていない個々の事案の情報の共有や、地域における必要な支援体制の検討を円滑にするものであり,息子を含めた複合的な生活がある本事例においては,その実施を検討することは適切といえる。 なお, 支援会議の構成員の役割は,1気になる事案の情報提供 情報共有, 2見守りと支援方針の理解, 3緊急性がある事案への対応があげられる (社会福祉法第106条の6)。 \n\n2 適切。地域包括支援センターの役割として,総合相談支援業務と介護予防ケアマネジメントがある。Aさんは入院時に低栄養状態であったことから, 介護予防 と日常生活支援を検討していく必要がある。 \n(『最新 社会福祉士養成講座2高齢者福祉』 中央法規出版,2021年 (以下『高齢者福祉』中央法規出版), p.92, 長寿社会開発センター 「地域包括支援センター業務マニュアル」 pp.7~8) \n\n3適切でない。 居宅介護支援事業所は、在宅の要介護 者に対して,日常生活に必要な保健・医療・福祉サービスの調整等を行う機関である。 Aさんは要介護状態 ではないことから,居宅介護支援事業所の介護支援専門員に介入を依頼するのは,適切ではない。 (『高齢者福祉』中央法規出版, pp.173~174, 「指定居宅介護支援等 の事業の人員及び運営に関する基準」(平成11年3月31日厚生省令第 38号)) \n\n4 適切でない。 生活支援体制整備事業の協議体は,地 域の住民とともに支え合う役割がある。 第1層協議体は,対象区域を市町村区域としている。 第2層協議体は日常生活圏域を想定している。 Aさんの場合,より身近な日常生活圏域における支え合いが適切である。 (『地域福祉と包括的支援体制』中央法規出版, p.88, 日本総合研究 所「新しい包括的支援事業における生活支援コーディネーター・協議 体の先行事例の調査研究事業報告書」 2017年) \n\n5 適切でない。認知症初期集中支援チームは,認知症の疑いのある人や認知症の人、 その家族に対して早い段階で支援を行うチームのことである。 Aさんは認知症の疑いがないので,認知症初期集中支援チームに介入を依頼するのは適切でない。 \n(『保健医療と福祉』 弘文堂, p.166, 国立長寿医療研究センター 「2020年度認知症初期集中支援チーム員研修テキスト」,2020年, P.6) ソーシャルワークの基盤と専門職(専門)", "answers": [1, 2], "expected": 2}, {"section": "権利擁護を支える法制度", "slide": 77, "question": "事例読んで、Ａ医療ソーシャルワーカーの対応として、最も適切なものを1つ選びなさい。\n\n〈事例〉\nＢさん（2歳）は、前日から熱があり、食欲がないことを心配した母親のＣさん（24歳）と受診に来た。小児科の看護師が診察のためにＢさんの服を脱がせたところ、背中やお尻に複数のあざがあることに気づいた。Ｃさんにあざの理由を聞いたところ、曖昧に答えた後に急に答えなくなってしまった。また、Ｃさんが持参した母子手帳には、定期健康診査をすべて受診していることとともに、Ｂさんの発語がやや遅れているとの記述があった。\nその後、病院に勤務するＡ医療ソーシャルワーカーは、看護師から、児童虐待が疑われる幼児が来院しており、面談してほしいとの依頼を受けた。", "options": ["Ｂさんが児童虐待を受けていると判断し、面接の前に児童相談所に通告する。", "Ｃさんとの面談の際、経済的に困窮していると相談されたので、児童発達支援センターを訪問するよう提案する。", "Ｃさんとの面談の際、Ｂさんの発達の遅れに悩んでいると相談されたので、保健所を訪問するよう提案する。", "Ｃさんとの面談の際、Ｂさんに暴力をふるう夫と別れたいと相談されたので、家庭裁判所を訪問するよう提案する。", "Ｃさんとの面談の後、Ｂさんの養育に不安を感じたので、児童相談所の情報提供を行う。"], "explanations": ["看護師の面談依頼のみで児童虐待と判断し。面接前に児童虐待と通告することは社会福祉士として拙速である。", "経済的な困窮は児童の養育についての問題であり、まずは生活保護の実施など、生活困窮者に対する支援を行う福祉事務所を教示すべきである。", "子どもの養育に係る施策は、児童相談所や福祉事務所、保健所などの行政機関が実施している。児童相談所は、子どもの養育における中核機関である。", "離婚には、協議離婚や調停離婚、裁判離婚があり。夫が同意して離婚する協議離婚では家庭裁判所を利用しない。", "〇"], "fullExplanation": "１　看護師の面談依頼のみで児童虐待と判断し。面接前に児童虐待と通告することは社会福祉士として拙速である。\n\n２　経済的な困窮は児童の養育についての問題であり、まずは生活保護の実施など、生活困窮者に対する支援を行う福祉事務所を教示すべきである。\n\n３　子どもの養育に係る施策は、児童相談所や福祉事務所、保健所などの行政機関が実施している。児童相談所は、子どもの養育における中核機関である。\n\n４　離婚には、協議離婚や調停離婚、裁判離婚があり。夫が同意して離婚する協議離婚では家庭裁判所を利用しない。\n\n５　〇", "answers": [5], "expected": 1}, {"section": "権利擁護を支える法制度", "slide": 79, "question": "事例を読んで,虐待に関する次の記述のうち,適切なものを2つ選びなさい。 \n\n[事例] \nNさんは(65 歳,女性) は,夫から十分な生活費を渡してもらえず、過度の節約を強要されている。結婚当初から,夫はNさんが働くことを認めなかった。 最近, 夫が些細なことで怒り、Nさんに暴力をふるうようになった。 Nさんは体調を崩したが, 自由に使えるお金がないため、病院を受診できずにいた。Nさんの友人でもある地域の民生委員が心配して, Nさんを病院に連れて行った。担当医は,Nさんに不自然なあざがあることに気づいた。", "options": ["Nさんは,「高齢者虐待防止法」における「高齢者」に該当する。", "病院に同行した民生委員は, 虐待に迅速に対応するため, Nさんの保護に必要な居室を確保する。", "病院は,高齢者虐待の早期発見に努める義務はない。", "病院は,Nさんが虐待を受けている事実を確認した上で通報しなければならない。", "通報を受けた市町村長は,必要に応じて,保健師等をNさんの居宅に立ち入らせて,必要な調査や質問をさせることができる。 \n\n(注)「高齢者虐待防止法」とは,「高齢者虐待の防止,高齢者の養護者に対する支援等に関する法律」のことである。"], "explanations": ["〇 高齢者虐待防止法第2条第1項において, 「高齢者」は65歳以上の者と定義されている。な お,65歳未満の者であっても,養介護施設に入 所している障害者等については,「高齢者」とみ なして養介護施設従業者等による高齢者虐待に関 する規定が適用される (同法同条第6項)。その ため,高齢者虐待防止法に基づく支援の対象は, 65歳以上に限らない。", "× Nさんの保護に必要な居室を確保するの は、民生委員の役割ではない。市町村は,養護者 (家族など) による高齢者虐待を受けた高齢者に ついて,老人福祉法の規定による措置を採るため に,必要な居室を確保するための措置を講ずるも のとされている (高齢者虐待防止法第10条)。", "× 養介護施設,病院,保健所その他高齢者の 福祉に業務上関係のある団体及び養介護施設従事 者等,医師,保健師, 弁護士その他高齢者の福祉 に職務上関係のある者は,高齢者虐待を発見しや すい立場にあることを自覚し, 高齢者虐待の早期 発見に努めなければならない(高齢者虐待防止法 第5条第1項)。", "× 虐待の事実確認は、 通報を受けた市町村が 行う(高齢者虐待防止法第9条)。 養護者による 高齢者虐待を受けたと思われる高齢者を発見した 者は,速やかにこれを市町村に通報するよう努 めなければならない(同法第7条第2項)。 なお、 当該高齢者の生命または身体に重大な危険が生じ ている場合は、速やかに市町村に通報しなければ ならない(同法同条第1項)。", "〇 虐待を疑う相談・通報を受理した市町村長 は、養護者による高齢者虐待により高齢者の生命 又は身体に重大な危険が生じているおそれがある と認めるときは、地域包括支援センターの職員そ の他の高齢者の福祉に関する事務に従事する職員 をして,当該高齢者の住所又は居所に立ち入り, 必要な調査又は質問をさせることができる (高齢 者虐待防止法第11条第1項)。"], "fullExplanation": "1〇 高齢者虐待防止法第2条第1項において, 「高齢者」は65歳以上の者と定義されている。な お,65歳未満の者であっても,養介護施設に入 所している障害者等については,「高齢者」とみ なして養介護施設従業者等による高齢者虐待に関 する規定が適用される (同法同条第6項)。その ため,高齢者虐待防止法に基づく支援の対象は, 65歳以上に限らない。 \n\n2 × Nさんの保護に必要な居室を確保するの は、民生委員の役割ではない。市町村は,養護者 (家族など) による高齢者虐待を受けた高齢者に ついて,老人福祉法の規定による措置を採るため に,必要な居室を確保するための措置を講ずるも のとされている (高齢者虐待防止法第10条)。\n\n 3 × 養介護施設,病院,保健所その他高齢者の 福祉に業務上関係のある団体及び養介護施設従事 者等,医師,保健師, 弁護士その他高齢者の福祉 に職務上関係のある者は,高齢者虐待を発見しや すい立場にあることを自覚し, 高齢者虐待の早期 発見に努めなければならない(高齢者虐待防止法 第5条第1項)。 \n\n4× 虐待の事実確認は、 通報を受けた市町村が 行う(高齢者虐待防止法第9条)。 養護者による 高齢者虐待を受けたと思われる高齢者を発見した 者は,速やかにこれを市町村に通報するよう努 めなければならない(同法第7条第2項)。 なお、 当該高齢者の生命または身体に重大な危険が生じ ている場合は、速やかに市町村に通報しなければ ならない(同法同条第1項)。 \n\n5〇 虐待を疑う相談・通報を受理した市町村長 は、養護者による高齢者虐待により高齢者の生命 又は身体に重大な危険が生じているおそれがある と認めるときは、地域包括支援センターの職員そ の他の高齢者の福祉に関する事務に従事する職員 をして,当該高齢者の住所又は居所に立ち入り, 必要な調査又は質問をさせることができる (高齢 者虐待防止法第11条第1項)。", "answers": [1, 5], "expected": 2}, {"section": "権利擁護を支える法制度", "slide": 81, "question": "事例を読んで, Lさんの成年後見制度利用に関する次の記述のうち, 適切なものを2つ選びなさい。 \n\n[事例] \nLさん (83歳,女性) は, 75歳まで市民病院で看護師として勤務しており、現在は一人暮らしである。4年前から認知症状が出現し, 主治医の勧めで,成年後見制度を利用することとなった。Lさんは,主治医の意見をもとに知り合いのM司法書士に相談し,家庭裁判所に対して成 年後見等開始の審判の申立てを行った。その結果,保佐開始の審判がなされて,M司法書士がLさんの保佐人となり,さまざまな役割を果たしている。", "options": ["Lさんが相続を放棄する場合,Mの同意は必要ない。", "家庭裁判所は,Lさんの請求によって,Mに対し, 介護保険の要介護認定の申請に関する代理権を付与する旨の裁 ide": 88, "question": "事例を読んで、災害時におけるＡ社会福祉協議会のＢ社会福祉士の対応として、適切なものを2つ選びなさい。\n\n〈事例〉\nＡ市では線状降水帯による河川の氾濫で多くの住宅が全・半壊し、被災者には仮設住宅が用意された。発災後、Ａ市の委託でＡ市社会福祉協議会に被災者見守り・相談支援事業実施センターが開設された。Ａ市社会福祉協議会に昨年入職したＢ社会福祉士が、生活支援相談員として活動することとなった。", "options": ["「以前利用していたデイサービスに通いたい」と訴える住宅の入居者に対して、「介護サービスのことはマネージャーに問い合わせるように」と伝えた。", "将来に不安を抱える仮設住宅の入居者に対して、生活支援相談員の定期訪問以外に「よりそいホットラインの活用方法」を紹介した。", "借上型の仮設住宅入居している被災者には、電話による安否確認を行うこととした。", "勤務時間中に職場のメンタルケアの研修に参加した。", "仮設住宅の入居者同士が出会い、関係づくりができるよう住民交流会を企画し、住民の先頭に立って準備を進めた。"], "explanations": ["仮設住宅の入居者には、支援や介護を有する高齢者も含まれ、生活支援相談員は介護サービスに関する相談を受けることもある。", "〇", "生活支援相談員は、仮設住宅の全戸訪問を行う必要がある。", "〇", "生活支援相談員の役割は、住民と一緒に計画を立て、それを実施する環境を整えることにある。"], "fullExplanation": "１　仮設住宅の入居者には、支援や介護を有する高齢者も含まれ、生活支援相談員は介護サービスに関する相談を受けることもある。\n\n２　〇\n\n３　生活支援相談員は、仮設住宅の全戸訪問を行う必要がある。\n\n４　〇\n\n５　生活支援相談員の役割は、住民と一緒に計画を立て、それを実施する環境を整えることにある。", "answers": [2, 4], "expected": 2}, {"section": "地域福祉と包括的支援体制", "slide": 90, "question": "事例を読んで,H福祉活動専門員 (社会福祉士) の行動に関する次の記述のうち, 適切なものを2つ選びなさい。 \n\n[事例] \nSさん (85歳) は (80歳) と二人暮らしで、妻には軽度の認知症がある。 ある日, Sさん夫妻を知る地区の住民から社会福祉協議会のH福祉活動専門員に電話があり,「Sさんは,妻が一人歩きをするようになったので, 夜寝るときに妻の身体をひもで縛って動けないようにしているそうです。 これって虐待ではないでしょうか」と興奮気味に話した。", "options": ["間違いなく虐待に当たるので, Sさんに厳重に注意をし, 妻の一時保護の手配を開始した。", "地域包括支援センターの保健師と一緒に家庭訪問し,妻の病状や生活実態等を把握することにした。", "妻が利用しているデイサービスの職員に対応を一任した。", "ひもで縛るのは一人歩きが原因であるため,精神科病院や施設等の社会資源を紹介した。", "Sさんも支援の対象と捉え、介護疲れやストレス等を感じていないか話を聴くことにした。"], "explanations": ["× 状況が判然としない事例の段階で虐待と断 定してはならないし, Sさんに対し, 厳重な注意 を行うことも適切ではない。 また, 一時保護は, 生命に対する危険度や緊急性を慎重に判断して, 市町村が決定する。", "地域包括支援センターは、市町村から委託を受けて,高齢者虐待防止など権利擁護に関する 業務を行っている。 住民からの情報提供がなされ た場合,事実確認を行う必要があり、虐待が疑わ れる段階で,地域包括支援センターと連携して家 庭訪問することは,高齢者虐待の早期発見等につ ながるため、適切な対応である。", "× まず,地区の住民から直接連絡を受けたH 福祉活動専門員が対応すべきである。 連絡を受けた時点で他の職員に対応を一任するのは、援助者 の姿勢として適切ではない。", "× 原因の特定 さらに解決策としての社会資 源の紹介などすべてが性急すぎる支援であり,適切ではない。", "○ 認知症の高齢者を介護する養護者(家族等) の中には,認知症になったという事実を受け入れることができない,あるいは,正しい知識がない ために虐待につながるケースもある。 今後の支援 の方向性を検討するためにも, Sさんの立場を理 解し傾聴することは適切な対応である。"], "fullExplanation": "1 × 状況が判然としない事例の段階で虐待と断 定してはならないし, Sさんに対し, 厳重な注意 を行うことも適切ではない。 また, 一時保護は, 生命に対する危険度や緊急性を慎重に判断して, 市町村が決定する。 \n\n2 地域包括支援センターは、市町村から委託を受けて,高齢者虐待防止など権利擁護に関する 業務を行っている。 住民からの情報提供がなされ た場合,事実確認を行う必要があり、虐待が疑わ れる段階で,地域包括支援センターと連携して家 庭訪問することは,高齢者虐待の早期発見等につ ながるため、適切な対応である。\n \n3 × まず,地区の住民から直接連絡を受けたH 福祉活動専門員が対応すべきである。 連絡を受けた時点で他の職員に対応を一任するのは、援助者 の姿勢として適切ではない。 \n\n4 × 原因の特定 さらに解決策としての社会資 源の紹介などすべてが性急すぎる支援であり,適切ではない。\n \n5 ○ 認知症の高齢者を介護する養護者(家族等) の中には,認知症になったという事実を受け入れることができない,あるいは,正しい知識がない ために虐待につながるケースもある。 今後の支援 の方向性を検討するためにも, Sさんの立場を理 解し傾聴することは適切な対応である。", "answers": [2, 5], "expected": 2}, {"section": "地域福祉と包括的支援体制", "slide": 92, "question": "事例を読んで, Tコーディネーターの職種として、最も適切なものを1つ選びなさい。 \n\n[事例] \nTコーディネーターは, 介護保険法の事業に基づいて,日常生活圏域に配置されている。地域には一人暮らしの高齢者が増えてきており、 住民対象の調査の結果,「ゴミ出しなどに困っている高齢者が多数いること」, 「機会があれば困っている人の手助けをしたいと思っている住民がいること」等がわかった。 不足している生活支援サービスの開発や新たな担い手の養成等 ついて,協議体で情報を共有し検討することにした。", "options": ["ボランティアコーディネーター", "生活支援コーディネーター", "地域福祉コーディネーター", "就職支援コーディネーター", "ひきこもり支援コーディネーター \n\n(注)ここでいう「協議体」とは, 介護保険制度の生活支援 介護予防サービスの体制整備に向けて。 \n市町村が資源開発を推進するために設置するものである。"], "explanations": ["× ボランティアコーディネーターは,1993年(平成5年) の中央社会福祉審議会 「ボランティ ア活動の中長期的な振興対策について」を受けて、 社会福祉協議会のボランティアセンターや民間の ボランティア協会等に配置されており,ボラン ティア活動の希望者とボランティアによる援助を 求める者の双方に対する支援を行う。", "〇　生活支援コーディネーター(地域支え合い 推進員)は,介護保険法の生活支援体制整備事業 に位置づけられており, 市長村全域 (第1層) 及 び中学校区等の日常生活圏域 (第2層) 等への配 置が想定されているが, 地域の実情に応じて多様 な配置が可能である。 生活支援コーディネーター は,市町村や地域包括支援センターと連携しなが ら,生活支援・介護予防サービス等の提供体制の 構築に向けたコーディネート機能を担う。 なお, 資格要件は定めていないが,都道府県が実施する 研修を受講することが望ましいとしている。", "× 地域福祉コーディネーターは、2008年(平 成20年)の「これからの地域福祉のあり方に関す る研究会報告書」により位置づけられたもので, 市町村の一定の圏域に整備する必要があるとして いる。地域福祉推進のキーパーソンとして, 近年 では社会福祉協議会等に配置されており,専門機 関やボランティア等と連携して、社会資源の開発 やネットワーク形成等を行う。なお,資格要件は 定められていない。", "× 就職支援コーディネーターは、ハローワー ク等に配置され, 支援対象者と個別に面接し,職 業相談や職業紹介等を行う。", "× ひきこもり対策推進事業実施要項 (厚生労 働省)によると, ひきこもり支援コーディネー ターは,市町村や, 都道府県, 指定都市が設置す る「ひきこもり地域支援センター」に原則2名以 上配置されており,ひきこもりに特化した専門的 な相談に応じるとともに,ひきこもり対策にとっ て必要な情報提供や段階的な支援等を行う。 な おひきこもり支援コーディネーターとして,社 会福祉士,精神保健福祉士,臨床心理士等がセン \nターに配置されている。"], "fullExplanation": "1 × ボランティアコーディネーターは,1993年(平成5年) の中央社会福祉審議会 「ボランティ ア活動の中長期的な振興対策について」を受けて、 社会福祉協議会のボランティアセンターや民間の ボランティア協会等に配置されており,ボラン ティア活動の希望者とボランティアによる援助を 求める者の双方に対する支援を行う。 \n\n2 〇　生活支援コーディネーター(地域支え合い 推進員)は,介護保険法の生活支援体制整備事業 に位置づけられており, 市長村全域 (第1層) 及 び中学校区等の日常生活圏域 (第2層) 等への配 置が想定されているが, 地域の実情に応じて多様 な配置が可能である。 生活支援コーディネーター は,市町村や地域包括支援センターと連携しなが ら,生活支援・介護予防サービス等の提供体制の 構築に向けたコーディネート機能を担う。 なお, 資格要件は定めていないが,都道府県が実施する 研修を受講することが望ましいとしている。 \n\n3 × 地域福祉コーディネーターは、2008年(平 成20年)の「これからの地域福祉のあり方に関す る研究会報告書」により位置づけられたもので, 市町村の一定の圏域に整備する必要があるとして いる。地域福祉推進のキーパーソンとして, 近年 では社会福祉協議会等に配置されており,専門機 関やボランティア等と連携して、社会資源の開発 やネットワーク形成等を行う。なお,資格要件は 定められていない。\n \n4 × 就職支援コーディネーターは、ハローワー ク等に配置され, 支援対象者と個別に面接し,職 業相談や職業紹介等を行う。 \n\n5 × ひきこもり対策推進事業実施要項 (厚生労 働省)によると, ひきこもり支援コーディネー ターは,市町村や, 都道府県, 指定都市が設置す る「ひきこもり地域支援センター」に原則2名以 上配置されており,ひきこもりに特化した専門的 な相談に応じるとともに,ひきこもり対策にとっ て必要な情報提供や段階的な支援等を行う。 な おひきこもり支援コーディネーターとして,社 会福祉士,精神保健福祉士,臨床心理士等がセン \nターに配置されている。", "answers": [2], "expected": 1}, {"section": "地域福祉と包括的支援体制", "slide": 94, "question": "事例を読んで, 社会福祉協議会の職員であるJ社会福祉士 (第2層生活支援コーディネーター)の対応に関する次の記述のうち, 最も適切なものを1つ選び なさい。 \n \n〔事例〕 \nU地区の民生委員から、山間地の一軒家で一人暮らしをするKさん (72歳,男性)に関する相談があった。 Kさんは定年後,都会からこの地区の空家に引っ越してきた移住者である。 自治会未加入であり,日頃から地元住民との付き合いはない。 民生委員が初めて訪問した際に, いわゆるごみ屋敷の状態であること,受け答えがはっきりしないことから、 今後どのようにKさんにかかわればよいかわからないとのことであった。 そこで, J社会福祉士は状況確認のため, Kさん宅への訪問を上司に提案することにした。", "options": ["Kさんに関する個人情報の提供を行政機関に求め、 事前に家族に連絡を取ることを提案した。", "自治会長とともに訪問し, 自治会に加入し自治会費を支払ってもらうことを提案した。", "不動産会社とともに訪問し, サービス付き高齢者向け住宅等への住み替えを提案した。", "行政機関に相談し, 行政代執行でごみ屋敷の状態を解消することを提案した。", "地域包括支援センター職員とともに訪問し, Kさんの状況を把握することを提案した。"], "explanations": ["適切でない。福祉サービス利用後や本人の同意後でもなく、現状では状況を把握していないため, 社会通念上, 客観的にみて合理的な理由とは判断できないことか ら,本人の利益や社会公共の利益がある場合等に該当するとは言えず, 行政も個人情報を第三者に提供する ことはできない(個人情報の保護に関する法律第18条)。", "適切でない。 自治会に加入することにより, ごみ集積所の利用や自治会主催の行事への参加、地域住民 との交流機会の増加, 災害時対応などが見込まれる。しかし、自治会は任意団体であり、本人の意思決定の 自由を侵害することからも加入の強制はできない。 \n(『地域福祉と包括的支援体制』 中央法規出版, p.9)", "適切でない。 サービス付き高齢者向け住宅は,安否 確認や生活相談サービスが受けられることから,高齢 者の住まいの確保において重要なものである。 しか し,本人の状況が把握できていない段階 xplanation": "１　介護保険の第一号被保険者となり、介護保険料の納付が必要となる。その費用は生活扶助の介護保険料加算として算定される。介護扶助は、介護サービスが原則として現物支給される。\n\n２　費用の全額が介護扶助として支給されるのは、介護保険の被保険者でない場合である。\n\n３　〇\n\n４　障害者総合支援法によるサービスと介護保険法の介護給付の両方が利用可能な場合は、介護保険給付が優先される。\n\n５　介護支援介護サービスが必要となった際、介護保険による介護サービスを利用することになり、その場合、介護支援専門員がケアプランを作成する。", "answers": [3], "expected": 1}, {"section": "貧困に対する支援", "slide": 124, "question": "事例を読んで,自立相談支援機関のT相談支援員の支援として適切なものを2つ選びなさい。 \n\n[事例] \nLさん(23歳 男性) は,独身で頼れる親族もいない。 契約社員として働いていたが, 雇用契約満了による雇止めになった。 求職活動はしているが,次の仕事が見つからず, 家賃の滞納が続き,今月末までにアパートを退去しなければならない。 所持金も少なく、 不安になったLさんは,自立相談支援機関を探して来所した。", "options": ["支援を求めて来所したことをねぎらい, Lさんの意向等を把握する。", "正社員で働くために, ジョブコーチによる支援を検討する。", "当面の住まいを確保するため,生活困窮者一時生活支援事業の利用を勧める。", "Lさんには配偶者がいないため,生活困窮者住居確保給付金は利用できないと説明する。", "Lさんは家賃を滞納しているため、 求職者支援制度による職業訓練を受講できないと説明する。"], "explanations": ["〇 今後の支援のためには、初めて相談に来た Lさんの不安や緊張などを受け止めて,信頼関係 の構築に努める必要があるため、適切な対応であ る。Lさんの生活状況やどのように解決したいと 望んでいるのかなど,意向等を正しく把握してい くことが求められる。", "x ジョブコーチは,職場に出向いて障害者や 事業主に対し,雇用の前後を通じて、障害の特性 を踏まえた専門的な援助を行う。 Lさんに障害はないため、ジョブコーチによる支援対象者には該当しない。", "〇生活困窮者一時生活支援事業は,所得が一 定水準以下で,住居がない又は住居を失うおそれ のある生活困窮者に対して, 一定期間, 宿泊場所 や衣食の提供、就職活動の支援等を行う。 Lさん が利用する事業として適切である。", "× 生活困窮者住居確保給付金は,離職等によ り住宅を失った又は失うおそれのある者が, 家賃 の支払いが困難になった場合に, 一定期間, 家賃相当額を支給するものである。よって, Lさんの ように配偶者がいなくても、要件を満たせば, 生 活困窮者住居確保給付金を利用できる。", "× 求職者支援制度は,働く意思があり、ハローワークに求職の申込みをしており, 雇用保険 を受給できない者等を対象としている。 よって, 家賃を滞納しているLさんも、要件を満たせば, 月10万円の職業訓練受講手当等を受給しながら, 無料で職業訓練を受講できる。 なお、給付金を受 けずに無料の職業訓練のみ受講することも可能で \nある。"], "fullExplanation": "1〇 今後の支援のためには、初めて相談に来た Lさんの不安や緊張などを受け止めて,信頼関係 の構築に努める必要があるため、適切な対応であ る。Lさんの生活状況やどのように解決したいと 望んでいるのかなど,意向等を正しく把握してい くことが求められる。\n \n2x ジョブコーチは,職場に出向いて障害者や 事業主に対し,雇用の前後を通じて、障害の特性 を踏まえた専門的な援助を行う。 Lさんに障害はないため、ジョブコーチによる支援対象者には該当しない。 \n\n3 〇生活困窮者一時生活支援事業は,所得が一 定水準以下で,住居がない又は住居を失うおそれ のある生活困窮者に対して, 一定期間, 宿泊場所 や衣食の提供、就職活動の支援等を行う。 Lさん が利用する事業として適切である。\n \n4 × 生活困窮者住居確保給付金は,離職等によ り住宅を失った又は失うおそれのある者が, 家賃 の支払いが困難になった場合に, 一定期間, 家賃相当額を支給するものである。よって, Lさんの ように配偶者がいなくても、要件を満たせば, 生 活困窮者住居確保給付金を利用できる。 \n\n5 × 求職者支援制度は,働く意思があり、ハローワークに求職の申込みをしており, 雇用保険 を受給できない者等を対象としている。 よって, 家賃を滞納しているLさんも、要件を満たせば, 月10万円の職業訓練受講手当等を受給しながら, 無料で職業訓練を受講できる。 なお、給付金を受 けずに無料の職業訓練のみ受講することも可能で \nある。", "answers": [1, 3], "expected": 2}, {"section": "貧困に対する支援", "slide": 126, "question": "事例を読んで,福祉事務所の就労支援コーディネーター (社会福祉士)による,Hさんへの就労支援におけるかかわりとして, 最も適切なものを1つ選びなさい。 \n\n〔事例〕 \nHさん(32歳)は,かつて中学校の教員をしていたが, 職場においてパワーハラスメントにあい, うつ病を発症し、離職を余儀なくされた。 離職してから5年間の治療を経て,現在は小康状態を保てており、医師からは軽労働は可能であると診断されている。 仕事があれば就労したいと考えているが完全には回復しておらず,また治療期間が長引いたことから,就労に自信をもてないでいる。 治療に専念する中で蓄えも底をつき, 2年前に生活困窮に陥ったことで生活保護の受給を開始,現在も受給を継続している。なお,Hさんは気分(感情)障害を事由として精神障害者保健福祉手帳3級の判定を受けている。", "options": ["Hさんの心身の状態に問題がないことを確認して, 就労支援プログラムへの参加を措置する。", "Hさんの仕事に対する意欲の喚起を行い, ハローワークと連携して一般就労を目指す。", "Hさんの同意を得た上で, 就労移行支援事業を利用して一般就労を目指す。", "Hさんの同意を得た上で,地域若者サポートステーションの利用を促す。", "Hさんの同意を得た上で, 生活困窮者自立支援制度の利用を促す。"], "explanations": ["適切でない。就労支援プログラムは、生活保護法第 27条の2を根拠として規定されており,被保護者の選択と決定に基づいて参加を勧奨するものである。したがって,本事例では,Hさんの意思によって就労支援 プログラムを利用することはあり得るが, 措置することは適切ではない (生活保護法第27条, 第27条の2)。", "適切でない。 精神障害者保健福祉手帳3級の障害認定を受け,軽労働は可能との診断を受けている状況であるので,現時点で直ちにハローワークと連携して一般就労を目指すことは留保すべきである。 \n(厚生労働省「生活保護受給者等就労自立促進事業」)", "適切。就労移行支援事業は,「障害者総合支援法」に基づき,一般就労を目指す障害者を対象に職業訓練 や就労支援を行うものであり 精神障害者保健福祉手帳3級であるHさんは、 利用対象者に含まれる。一般就労は福祉事務所とハローワークの連携によって目指されることが多いが, Hさんの場合は,小康状態を保っているものの完全に回復してはおらず, 「軽労働は可能である」という状況であるので, 24か月という期間内で一般就労を目指す就労移行支援事業の利用が適切であると考えられる。 \n(厚生労働省「障害者の就労支援について」 第112回社会保障審議会 障害者部会(令和3年6月21日)資料 5,『最新 社会福祉士精神保健 福祉士養成講座 8 障害者福祉』 中央法規出版, 2021年, p.148,厚生 省保健医療局長通知「精神障害者保健福祉手帳の障害等級の判定基準 について」(平成7年9月12日 (健医発第1133号)))", "適切でない。地域若者サポートステーションは15~49歳の働くことに悩みを抱えている者を対象に就労支援を行う機関である。Hさんは,単に働くことに悩みを抱えているだけではなく、精神障害があり,小康状態を保ってはいるものの完全に回復してはおらず,精 神障害者保健福祉手帳3級に該当するため、就労に向けて利用する機関として 「最も適切」 であるとはいえない。 \n(厚生労働省「地域若者サポートステーション」)", "適切でない。 生活困窮者自立支援制度は生活に困窮し,生活保護制度を受給していない者を対象に貧困状態に陥らないようにすることを目的とする。Hさんは,生活保護を受給中であるので、生活困窮者自立支援制度の対象に含まれない (生活困窮者自立支援法第3条)。 なお,2024年(令和6年)の改正により, 2025年(令和7年)4月以降, 生活困窮者就労準備支援事業等の対象者に特定被保護者(生活保護脱却が見込まれる者)が追加されることとなった(厚生労働省「令和6年生活保護法等の改正について(居住支援関 係)」)"], "fullExplanation": "1 適切でない。就労支援プログラムは、生活保護法第 27条の2を根拠として規定されており,被保護者の選択と決定に基づいて参加を勧奨するものである。したがって,本事例では,Hさんの意思によって就労支援 プログラムを利用することはあり得るが, 措置することは適切ではない (生活保護法第27条, 第27条の2)。 \n\n2 適切でない。 精神障害者保健福祉手帳3級の障害認定を受け,軽労働は可能との診断を受けている状況であるので,現時点で直ちにハローワークと連携して一般就労を目指すことは留保すべきである。 \n(厚生労働省「生活保護受給者等就労自立促進事業」) \n\n3 適切。就労移行支援事業は,「障害者総合支援法」に基づき,一般就労を目指す障害者を対象に職業訓練 や就労支援を行うものであり 精神障害者保健福祉手帳3級であるHさんは、 利用対象者に含まれる。一般就労は福祉事務所とハローワークの連携によって目指されることが多いが, Hさんの場合は,小康状態を保っているものの完全に回復してはおらず, 「軽労働は可能である」という状況であるので, 24か月という期間内で一般就労を目指す就労移行支援事業の利用が適切であると考えられる。 \n(厚生労働省「障害者の就労支援について」 第112回社会保障審議会 障害者部会(令和3年6月21日)資料 5,『最新 社会福祉士精神保健 福祉士養成講座 8 障害者福祉』 中央法規出版, 2021年, p.148,厚生 省保健医療局長通知「精神障害者保健福祉手帳の障害等級の判定基準 について」(平成7年9月12日 (健医発第1133号))) \n\n4 適切でない。地域若者サポートステーションは15~49歳の働くことに悩みを抱えている者を対象に就労支援を行う機関である。Hさんは,単に働くことに悩みを抱えているだけではなく、精神障害があり,小康状態を保ってはいるものの完全に回復してはおらず,精 神障害者保健福祉手帳3級に該当するため、就労に向けて利用する機関として 「最も適切」 であるとはいえない。 \n(厚生労働省「地域若者サポートステーション」) \n\n5 適切でない。 生活困窮者自立支援制度は生活に困窮し,生活保護制度を受給していない者を対象に貧困状態に陥らないようにすることを目的とする。Hさんは,生活保護を受給中であるので、生活困窮者自立支援制度の対象に含まれない (生活困窮者自立支援法第3条)。 なお,2024年(令和6年)の改正により, 2025年(令和7年)4月以降, 生活困窮者就労準備支援事業等の対象者に特定被保護者(生活保護脱却が見込まれる者)が追加されることとなった(厚生労働省「令和6年生活保護法等の改正について(居住支援関 係)」)", "answers": [3], "expected": 1}, {"section": "貧困に対する支援", "slide": 128, "question": "事例を読んで, U自立相談支援機関(福祉事務所設置自治体N市の直営)のJ相談支援員(社会福祉士) が行ったこの段階における対応として,最も適切なものを1つ選びなさい。 \n\n〔事例〕 \nKさん (45歳,女性)はシングルマザーであり,認知症の疑いがあるものの要介護等の認定を受けていない70代の母親Lさんと小学生の娘のMさん(12歳)の3人世帯である。これまで, 家計はKさんの契約社員としての給与とLさんの年金で賄っていた。 また, Lさんの介護と世帯の家事全般はMさんが担っていた。数か月前に,Kさんは契約期間満了に伴い退職し,雇用保険の基本手当の給付を受けながら就職活動をしていたが, 再就職先が見つからず家計が厳しくなったため,自立相談支援機関に来所して相談を受けた。 J相談支援員との初回面接時, Kさんの主訴は経済的な困窮であったが,面接の回数を重ねるうちに、 家事やLさんの介護のためにMさんの学校の欠席回数が増加していること, 担任教諭から家庭訪問の実施に関する手紙や電話が来ているが, 回答ができていないという状況が明らかとなった。", "options": ["Kさんの心身の休息のため, Lさんのショートステイの利用を決定した。", "家計の安定化のため、 家計改善支援事業の利用を提案した。", "Kさんの再就職のため、就労準備支援事業の利用を提案した。", "世帯に関する支援情報の共有化のため、支援会議の開催を準備した。", "Mさんへの対応を学校に委ねるため、スクールソーシャルワーカーに連絡した"], "explanations": ["適切でない。 事例ではLさんの介護や世帯の家事全般はMさんが担っている。 Lさんのショートステイの利用によるMさんの負担軽減は見込まれるが,Kさんの心身の休息の手段となるのかは不明である。Lさんのショートステイ利用を検討する場合,まず, 要介護等の認定を申請するなど地域包括支援センターや介護支援専門員等と連携しながら支援を行う必要がある。また,世帯全体への支援という視点からはMさんへの \n支援も考慮に入れる必要がある。 何より, 相談者であるKさんの意思を確認していないことから,この時点でJ相談支援員が決定するという選択肢は適切とはいえない。 \n(厚生労働省老健局資料「短期入所生活介護」 (令和5年7月10日第 219回社会保障審議会介護給付費分科会(web会議) 資料4),『貧困 に対する支援』中央法規出版, p.191)", "適切でない。 家計改善支援事業は、家計の収支の均衡がとれていないなど, 家計に課題を抱える人への相談支援を行う事業である。 事例のKさんは, 支援開始時の主訴は雇止めによる経済的な困窮であったが,家計改善支援事業の利用では, 雇止めにより収入がなくなる事態を解決することはできず,また,その後に明らかとなったLさんやMさんを含む世帯全体に包括的に対応すべき課題が残るため、選択肢は最も適切とはいえない。 \n(厚生労働省ホームページ社会保障審議会生活困窮者自立支援及び生 活保護部会(第20回) 「家計改善支援等の在り方について」,「貧困に 対する支援』中央法規出版,p.135)", "適切でない。 就労準備支援事業は、疾病や障害,社会参加のための準備が必要な人など多様な状態像に即して、就労に必要な知識や能力向上のための訓練を行い一般就労に限定せずに多様な就労に結びつける事業である。Kさんは、契約期間の満了まで就労が継続し,かつ,早期の再就職が主訴であることを踏まえると就労準備支援事業による支援はKさんのニーズと整合しないため選択肢は適切とはいえない。 \n(厚生労働省ホームページ 「就労準備支援,就労訓練事業ガイドライ 「ンについて」 平成26年 『貧困に対する支援』 中央法規出版, p.135)", "適切。支援の対象は,Kさんだけではなく世帯全体と考えられる。 LさんやMさんという家族や周囲の環境を含んで包括的に支援していく視点が重要である。事例ではKさんの 「就労支援」やLさんの 「認知症」, Mさんの「ヤングケアラー」「不登校」と個別に位置づけるのではなく, 世帯の抱える課題の多層性に着目 して,N市(直営のU自立相談支援機関)が支援会議 を開催し,支援者同士の情報共有を行い, 包括的な視点から支援を展開するという選択肢は最も適切といえる。", "適切でない。 児童生徒の問題行動や不登校などの背景には、家庭の経済的課題や福祉的ニーズが内在するため,自立相談支援機関と学校等との連携は重要である。各機関にはそれぞれ別の目的 ・ 役割があるため, 関係機関としての相互の連携や相談が重要であり,選択肢のように「対応を委ねる」という,いわゆる「丸投げ」は不適切である。 \n(『貧困に対する支援』 中央法規出版, p.189, 厚生労働省社会・援護 局地域福祉課長通知 「生活困窮者自立支援制度と教育施策との連携に ついて(通知)」 平成27年3月27日社援地発0327第7号, ヤングケア ラーの支援に向けた福祉・介護・医療・教育の連携プロジェクトチー ム報告」(令和3年5月17日))"], "fullExplanation": "1適切でない。 事例ではLさんの介護や世帯の家事全般はMさんが担っている。 Lさんのショートステイの利用によるMさんの負担軽減は見込まれるが,Kさんの心身の休息の手段となるのかは不明である。Lさんのショートステイ利用を検討する場合,まず, 要介護等の認定を申請するなど地域包括支援センターや介護支援専門員等と連携しながら支援を行う必要がある。また,世帯全体への支援という視点からはMさんへの \n支援も考慮に入れる必要がある。 何より, 相談者であるKさんの意思を確認していないことから,この時点でJ相談支援員が決定するという選択肢は適切とはいえない。 \n(厚生労働省老健局資料「短期入所生活介護」 (令和5年7月10日第 219回社会保障審議会介護給付費分科会(web会議) 資料4),『貧困 に対する支援』中央法規出版, p.191) \n\n2適切でない。 家計改善支援事業は、家計の収支の均衡がとれていないなど, 家計に課題を抱える人への相談支援を行う事業である。 事例のKさんは, 支援開始時の主訴は雇止めによる経済的な困窮であったが,家計改善支援事業の利用では, 雇止めにより収入がなくなる事態を解決することはできず,また,その後に明らかとなったLさんやMさんを含む世帯全体に包括的に対応すべき課題が残るため、選択肢は最も適切とはいえない。 \n(厚生労働省ホームページ社会保障審議会生活困窮者自立支援及び生 活保護部会(第20回) 「家計改善支援等の在り方について」,「貧困に 対する支援』中央法規出版,p.135) \n\n3適切でない。 就労準備支援事業は、疾病や障害,社会参加のための準備が必要な人など多様な状態像に即して、就労に必要な知識や能力向上のための訓練を行い一般就労に限定せずに多様な就労に結びつける事業である。Kさんは、契約期間の満了まで就労が継続し,かつ,早期の再就職が主訴であることを踏まえると就労準備支援事業による支援はKさんのニーズと整合しないため選択肢は適切とはいえない。 \n(厚生労働省ホームページ 「就労準備支援,就労訓練事業ガイドライ 「ンについて」 平成26年 『貧困に対する支援』 中央法規出版, p.135) \n\n4 適切。支援の対象は,Kさんだけではなく世帯全体と考えられる。 LさんやMさんという家族や周囲の環境を含んで包括的に支援していく視点が重要である。事例ではKさんの 「就労支援」やLさんの 「認知症」, Mさんの「ヤングケアラー」「不登校」と個別に位置づけるのではなく, 世帯の抱える課題の多層性に着目 して,N市(直営のU自立相談支援機関)が支援会議 を開催し,支援者同士の情報共有を行い, 包括的な視点から支援を展開するという選択肢は最も適切といえる。\n\n5 適切でない。 児童生徒の問題行動や不登校などの背景には、家庭の経済的課題や福祉的ニーズが内在するため,自立相談支援機関と学校等との連携は重要である。各機関にはそれぞれ別の目的 ・ 役割があるため, 関係機関としての相互の連携や相談が重要であり,選択肢のように「対応を委ねる」という,いわゆる「丸投げ」は不適切である。 \n(『貧困に対する支援』 中央法規出版, p.189, 厚生労働省社会・援護 局地域福祉課長通知 「生活困窮者自立支援制度と教育施策との連携に ついて(通知)」 平成27年3月27日社援地発0327第7号, ヤングケア ラーの支援に向けた福祉・介護・医療・教育の連携プロジェクトチー ム報告」(令和3年5月17日))", "answers": [4], "expected": 1}, {"section": "福祉サービスの組織と運営", "slide": 131, "question": "事例を読んで, K センター長の対応として,最も適切なものを1つ選びなさい。 \n\n[事例] \nMさん(男性)は,H市地域包括支援センターで3年前から正規職員として働いている。 Mさんは、配偶者が間もなく出産することを上司であるKセンター長に報告し,今後の勤務について相談した。この時点で,Mさんは雇用保険に加入しており、14日の有給休暇が残っている。配偶者は,一般企業に勤務しており、 産前休業中である\n。", "options": ["Mさんが申請すれば, Mさんも産前休業を取得することができると説明した。", "Mさんが申請すれば,子どもの出生後に8週間の産後パパ育児休業の取得が可能であると説明した。", "Mさんが育児休業を取得した場合,その期間は健康保険料の支払いは免除されると説明した。", "Mさんは,育児休業を取得する前に有給休暇を消化しなければならないと説明した。", "Mさんと配偶者がともに育児休業を取得する場合, Mさんの育児休業取得可能日数を1年2か月まで延長できると説明した。"], "explanations": ["× 産前休業は、6週間 (多胎妊娠の場合は 14 週間)以内に出産予定の女性が, 使用者に休業を 申請した場合に取得することができる (労働基準 法第65条)。Mさんは男性であり、男性の産前 休業に関する規定はない。", "× 産後パパ育児休業は, 通常の育児休業制度 とは別に設けられた制度である。 原則として休業 の2週間前までに申出をすることで,子どもの出 生後8週間以内に最長4週間の休業が可能となる。", "○ 育児休業は,原則として1歳未満の子ども を養育する労働者(自営業やフリーランスは除く) を対象に,その子どもが1歳(保育園が見つからないなど事情がある場合には最長2歳)になるまで休業することができる制度である(育児・介護 休業法第5条)。 休業期間の上限は1年間であり、 分割して2回取得することも可能である。 また, その間の健康保険料や厚生年金保険料, 40歳以 上であれば介護保険料の支払いが免除される。", "x 育児休業をとるために有給休暇の消化を強 制させることはできない。 育児休業は, 育児・介 護休業法に基づく制度であり、労働基準法に基づ く有給休暇制度とは別のものである。", "× 両親がともに育児休業を取得する場合,育 児休業の対象となる子の年齢が1歳2か月まで延 長される制度 (パパ・ママ育休プラス) がある (育 児介護休業法第9条の6)。 ただし, 一人当た りの育休取得可能最大日数(産後休業含め1年間) が増える訳ではないことに注意が必要である。"], "fullExplanation": "1 × 産前休業は、6週間 (多胎妊娠の場合は 14 週間)以内に出産予定の女性が, 使用者に休業を 申請した場合に取得することができる (労働基準 法第65条)。Mさんは男性であり、男性の産前 休業に関する規定はない。 \n2 × 産後パパ育児休業は, 通常の育児休業制度 とは別に設けられた制度である。 原則として休業 の2週間前までに申出をすることで,子どもの出 生後8週間以内に最長4週間の休業が可能となる。\n \n3○ 育児休業は,原則として1歳未満の子ども を養育する労働者(自営業やフリーランスは除く) を対象に,その子どもが1歳(保育園が見つからないなど事情がある場合には最長2歳)になるまで休業することができる制度である(育児・介護 休業法第5条)。 休業期間の上限は1年間であり、 分割して2回取得することも可能である。 また, その間の健康保険料や厚生年金保険料, 40歳以 上であれば介護保険料の支払いが免除される。 \n\n4 x 育児休業をとるために有給休暇の消化を強 制させることはできない。 育児休業は, 育児・介 護休業法に基づく制度であり、労働基準法に基づ く有給休暇制度とは別のものである。\n \n5 × 両親がともに育児休業を取得する場合,育 児休業の対象となる子の年齢が1歳2か月まで延 長される制度 (パパ・ママ育休プラス) がある (育 児介護休業法第9条の6)。 ただし, 一人当た りの育休取得可能最大日数(産後休業含め1年間) が増える訳ではないことに注意が必要である。", "answers": [3], "expected": 1}];const $=id=>document.getElementById(id);let queue=[],pos=0,selected=[],shown=false;let records={};try{records=JSON.parse(localStorage.getItem('case-trainer-v1')||'{}')}catch(e){};const categories=['すべての科目',...new Set(DATA.map(x=>x.section))];for(let c of categories){let o=document.createElement('option');o.value=c;o.textContent=c;$('category').append(o)}
function save(){try{localStorage.setItem('case-trainer-v1',JSON.stringify(records))}catch(e){}}function key(q){return 's'+q.slide}function start(){let cat=$('category').value;queue=DATA.filter(q=>cat==='すべての科目'||q.section===cat);if($('order').value==='wrong')queue=queue.filter(q=>records[key(q)]&&records[key(q)].wrong>0);if($('order').value==='random')queue.sort(()=>Math.random()-.5);pos=0;render()}function elt(tag,cls,text){let n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function render(){selected=[];shown=false;let q=queue[pos];$('result').hidden=true;$('options').replaceChildren();$('check').disabled=!q;$('prev').disabled=pos===0;$('next').disabled=pos>=queue.length-1;$('progress').textContent=q?`問題 ${pos+1} / ${queue.length}`:'問題なし';$('subject').textContent=q?q.section:'';$('heading').textContent=q?'事例を読み、適切な選択肢を選びましょう':'該当する問題がありません';$('case').textContent=q?q.question:'';$('instruction').textContent=q?`${q.expected}つ選んでください（選択肢は複数選択に対応）`:'';if(!q){stats();return}q.options.forEach((v,i)=>{let b=elt('button','choice');b.type='button';b.append(elt('span','num',String(i+1)));b.append(elt('span','',v));b.onclick=()=>{if(shown)return;let at=selected.indexOf(i+1);if(at>=0)selected.splice(at,1);else{if(selected.length>=q.expected)selected.shift();selected.push(i+1)}Array.from($('options').children).forEach((x,j)=>{x.classList.toggle('on',selected.includes(j+1));x.setAttribute('aria-pressed',String(selected.includes(j+1)))})};$('options').append(b)});stats()}
function stats(){let answered=Object.keys(records).length,correct=Object.values(records).filter(x=>x.correct>0).length;$('stats').textContent=`全${DATA.length}問 ／ 学習済み ${answered}問 ／ 正解経験あり ${correct}問（記録はこのブラウザ内のみ）`}
$('check').onclick=()=>{let q=queue[pos];if(!q||shown)return;if(selected.length!==q.expected){alert(`${q.expected}つ選んでください`);return}shown=true;let ok=selected.slice().sort().join(',')===q.answers.slice().sort().join(',');let k=key(q);let r=records[k]||{correct:0,wrong:0};r[ok?'correct':'wrong']++;records[k]=r;save();let box=$('result');box.replaceChildren();box.append(elt('strong',ok?'correct':'wrong',ok?'正解です！':'不正解です'));box.append(elt('p','',`正解：${q.answers.join('・')} ／ あなたの解答：${selected.slice().sort().join('・')}`));let d=elt('div','explain');d.textContent=q.fullExplanation||q.explanations.map((x,i)=>`${i+1}　${x}`).join('\n\n');box.append(d);box.hidden=false;stats()};$('next').onclick=()=>{if(pos<queue.length-1){pos++;render();window.scrollTo(0,0)}};$('prev').onclick=()=>{if(pos>0){pos--;render();window.scrollTo(0,0)}};$('reset').onclick=start;$('category').onchange=start;$('order').onchange=start;$('clear').onclick=()=>{if(confirm('この端末に保存した学習記録をすべて消去しますか？')){records={};save();start()}};start();
</script></body></html>
